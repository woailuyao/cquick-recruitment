# =============================================================================
# config/field.yaml —— 场地标志点坐标（单位：米）
#
# 按组长通知：任务二的地图 yaml 由本人参考官方 field.yaml 的格式自行定义，
# 再用它做特征匹配与坐标求解。
#
# 【只覆盖球门侧半场（x >= 0）】
#   现场只在球门侧半场测试，远端半场当作不存在，因此这里只保留 x >= 0 的标志点
#   （共 12 个：XCross 2、TCross 6、LCross 4）。远端半场（x < 0）的标志不参与
#   匹配，也不会出现在地图窗口里。这同时也消除了“整体转 180° 仍成立”的那类多解。
#
# 重要：坐标必须与实际场地一致。若现场卷尺实测与下列坐标不符，应修正本文件
#       （而不是改算法去迁就地图）。程序终端 `[scale]` 会打印
#       “观测间距 / 地图间距”的比值，接近 1.00 说明外参与地图尺度一致。
#
# 坐标系（与《场地坐标系示意图（俯视图）》一致）：
#   原点 O = 场地中心（中圈圆心）；
#   +X 指向球门，+Y 为面向 +X 时的左侧，+Z 垂直地面向上；
#   地面 Z=0，长度单位 m；yaw 从 +X 逆时针为正（俯视）。
# =============================================================================
map_version: "C0-custom-v2"

field_markers:
  # ---------------- XCross（中线上，x=0）----------------
  - {type: XCross, x: 0.0, y: 0.75}
  - {type: XCross, x: 0.0, y: -0.75}
  # ---------------- TCross ----------------
  # 中线与两条边线的交点（x=0）
  - {type: TCross, x: 0.0, y: 3.0}
  - {type: TCross, x: 0.0, y: -3.0}
  # 球门线（x=+3.96）：罚球区/球门区与球门线的交点
  - {type: TCross, x: 3.96, y: 1.95}
  - {type: TCross, x: 3.96, y: -1.95}
  - {type: TCross, x: 3.96, y: 1.5}
  - {type: TCross, x: 3.96, y: -1.5}
  # ---------------- LCross（球门侧半场内的角点）----------------
  - {type: LCross, x: 2.05, y: 2.0}
  - {type: LCross, x: 2.05, y: -2.0}
  - {type: LCross, x: 3.0, y: 1.49}
  - {type: LCross, x: 3.0, y: -1.49}
