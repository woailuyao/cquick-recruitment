# =============================================================================
# camera_extrinsics.yaml —— 相机安装外参（载体/测试架 -> 相机）
#
# 已按实际安装测量（相机固定在桌子边缘）：
#   camera_height_m = 0.82 m  （卷尺量相机光心到地面的垂直距离）
#   pitch_deg       = 8.0°   （光轴相对水平面向下倾斜 8°）
#   roll_deg        = 0.0     （本次按 0 处理，不作三维姿态求解）
#
# 注意：训练集图片是手持随手拍的，不满足固定安装条件，
#       不能用训练图片反推这两个值；地面投影只使用本文件的实测值。
# 现场若重新调整安装，改这里的数值即可（或在程序里按 o 反推、w 写回）。
# =============================================================================
camera_height_m: 0.82
pitch_deg: 8.0
roll_deg: 0.0

# 载体参考原点定义：相机光心在地面 Z=0 的投影点
# 因此 carrier_pose == camera_pose（若以后装到机器人底座，再改这里的偏移）
base_to_camera:
  x_m: 0.0
  y_m: 0.0
  dyaw_deg: 0.0

mount: "固定在桌子边缘（相机光心离地 0.82 m，光轴下倾 8°）"
calibration_method: "卷尺量光心离地高度；量角器/水平仪测光轴下倾角"
calibration_date: ""
