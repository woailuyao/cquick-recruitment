# =============================================================================
# marker_data.yaml —— 场地标志检测数据集（YOLO 格式）
#
# 按提交规范，图片/标注/原始视频均**不上传仓库**。
# 本地把抽帧+标注好的数据集放在本文件同级，或修改下面的 path，例如：
#   dataset/soccer_dataset_marker/images/{train,val}
#   dataset/soccer_dataset_marker/labels/{train,val}
#
# 当前只训练现场存在的 3 类；现场没有点球点，故未训练 PenaltyPoint(class_id 3)。
# 若以后加入点球点，需要同时更新本文件、config/field.yaml 和
# src/match_map.py 的 CLASS_NAMES / _NAME_TO_CLS。
# =============================================================================
path: ./soccer_dataset_marker
train: images/train
val: images/val
# test: images/test        # 待补：当前没有独立 test 划分（见 dataset_summary.md）

nc: 3
names:
  0: LCross
  1: TCross
  2: XCross
