# 提交用统一相机配置（细则建议 config/camera.yaml）
# 汇总设备接口、分辨率/帧率、内参、外参；各数值的原始来源文件一并列出。
# 细则 118 行：不要求记录/提交摄像头品牌与具体型号，故此处不写。

camera:
  type: 单目 RGB USB 摄像头
  interface: USB（Windows DirectShow / DSHOW，index 0）
  device_node_ubuntu: "待现场填（/dev/videoX）"
  resolution: [1280, 720]
  pixel_format: MJPG
  fps_measured: 30
  fps_method: 连续取帧实际耗时统计（logs/capture_log.csv）；
    CAP_PROP_FPS 返回值不作为实测帧率
  focus: 固定对焦，锁定后未再变动
  focal_length_mm: 未知（模组未标注，报告按「未知」如实填写）
  note: 分辨率 / 裁剪 / 缩放改变后必须重新标定或同步换算内参

# ------------------------------------------------------------------
# 内参分工：同一模组因对焦呼吸效应在不同工作距离有不同 fx，故拆三套，
# 不要混用。诊断过程见 docs/命令速查.md 第 8 节与 tools/measure_fx_ruler.py。
intrinsics:
  task1_undistort:
    file: config/camera_intrinsics.yaml
    usage: 任务一去畸变 / 存档（近距棋盘格标定 RMS 0.9687 px）
    fx: 2030.69079
    fy: 2027.21813
    cx: 578.17072
    cy: 402.177264
    k1: 0.23041051
    k2: 1.91765504
    p1: 0.00237452
    p2: -0.03528835
    k3: -12.54502517
    warning: k3=-12.5 在画面边缘外使畸变多项式过零折叠，
      严禁用于任务二的远距地面几何解算

  task2_geometry:
    file: config/camera_intrinsics_fieldvideo.yaml
    usage: 任务二场地视频 PnP / 地面投影（v2 工作内参）
    fx: 1620.0
    fy: 1620.0
    cx: 602.411755
    cy: 365.033275
    k1: 0.17091399
    k2: -0.56531384
    p1: -0.00845623
    p2: -0.01488631
    k3: 2.88758479
    note: fx=1620 来自平行板直测三档(1591/1662/1615)与位姿反推(1600~1750)互证；
      cx/cy/畸变取自 2026-11-13 的 15 张健康标定（RMS 0.33 px）

  future_capture:
    file: config/camera_intrinsics_field.yaml
    usage: 封环后未来拍摄（fx=1316，RMS 0.3325），本轮未使用

# ------------------------------------------------------------------
extrinsics:
  file: calibration/camera_extrinsics.yaml
  method: 墙脚线几何法（tools/check_extrinsics.py，投影自检 0.1 px）
  pitch_deg: 14.525
  roll_deg: 1.519
  h_table_m: 0.222              # 桌边平板标定时镜头离地高度
  h_field_m: 0.55               # 2026-11-12 现场 pose 段实测光心高度
  height_note: 俯仰 / 滚转随刚性安装不变，到场地只重量 h；
    角度沿用桌边标定值，误差表用 h_field_m 做物理消歧先验
  carrier_frame: 独立移动测试架，按细则以相机光心为载体参考原点，
    x_carrier_map = x_camera_map；输出坐标系 camera_frame

