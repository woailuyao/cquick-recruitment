# 整机第二套动作：抬一条腿 → 摆两下 → 放下（模板，pwm 值按实际结构调整）
#
# 为什么第二套要做「摆动」而不是「单次到位」：
# 任务 3 要求两套动作能体现你真在做数据驱动 —— 摆动天然需要「多个 step 串行 + 中途反向」，
# 如果第二套只是第一套改几个数字，评审一眼就看出来是凑数。
#
# 用之前先确认：
#   1) 四个舵机 ID 已改成 1/2/3/4，servo_params.yaml 的 servo_ids: [1, 2, 3, 4]
#   2) 这里假设 id=1 是左前腿、抬起方向是 pwm 变大（1500 → 1620）
#      如果实测方向相反，把 1620/1380 对调即可，不用改 python
#
# 用法：ros2 run cquick_servo sequence_player --action wave_hi
name: wave_hi
description: 左前腿抬起后左右摆两下再放下，其余三腿保持中位支撑
loop: false

steps:
  # ---- 起手：四条腿全部明确回中位，保证每次播放的初始姿态一致 ----
  - name: 全腿回中位
    joints:
      - {id: 1, pwm: 1500, duration_ms: 600}
      - {id: 2, pwm: 1500, duration_ms: 600}
      - {id: 3, pwm: 1500, duration_ms: 600}
      - {id: 4, pwm: 1500, duration_ms: 600}

  # ---- 抬腿：只动 id=1，其余三腿发「原地保持」，靠 result 保证它们不动 ----
  - name: 左前腿抬起
    joints:
      - {id: 1, pwm: 1620, duration_ms: 900}
      - {id: 2, pwm: 1500, duration_ms: 900}
      - {id: 3, pwm: 1500, duration_ms: 900}
      - {id: 4, pwm: 1500, duration_ms: 900}

  # ---- 摆动：两个 step 一左一右，串行执行 ----
  - name: 摆左
    joints:
      - {id: 1, pwm: 1740, duration_ms: 450}

  - name: 摆右
    joints:
      - {id: 1, pwm: 1560, duration_ms: 450}

  - name: 摆左（第二次）
    joints:
      - {id: 1, pwm: 1740, duration_ms: 450}

  - name: 摆右（第二次）
    joints:
      - {id: 1, pwm: 1560, duration_ms: 450}

  # ---- 收：先回抬腿位，再整体落回中位 ----
  - name: 左前腿回到抬腿位
    joints:
      - {id: 1, pwm: 1620, duration_ms: 400}

  - name: 全腿落回中位
    joints:
      - {id: 1, pwm: 1500, duration_ms: 900}
      - {id: 2, pwm: 1500, duration_ms: 900}
      - {id: 3, pwm: 1500, duration_ms: 900}
      - {id: 4, pwm: 1500, duration_ms: 900}
