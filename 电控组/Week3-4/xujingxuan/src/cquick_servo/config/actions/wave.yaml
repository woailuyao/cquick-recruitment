# 动作组定义：挥手（验证「一步之内有先后」）
#
# 第 2 步只有一个 move，作用是让 ID 0 先单独做完，再进入第 3 步的双手协同。
# 这就是「先后」的正确写法 —— 单独开一个 step，而不是调 duration 硬凑。

name: wave
description: 抬手 → 单关节前后摆两次 → 收手回中位
repeat: 2
steps:
  - name: 抬手
    moves:
      - {id: 0, pwm: 1400, duration_ms: 1000}
      - {id: 1, pwm: 1600, duration_ms: 1000}

  - name: 只用右手摆一下（单独一步 = 先后）
    moves:
      - {id: 0, pwm: 1300, duration_ms: 1000}

  - name: 摆回来
    moves:
      - {id: 0, pwm: 1500, duration_ms: 1000}

  - name: 双手一起收
    moves:
      - {id: 0, pwm: 1500, duration_ms: 1000}
      - {id: 1, pwm: 1500, duration_ms: 1000}
