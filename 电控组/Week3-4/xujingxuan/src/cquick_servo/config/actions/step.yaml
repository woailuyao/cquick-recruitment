# step.yaml —— 原地踏步（左右交替抬腿）
#
# 左右镜像：左侧用 +，右侧用 -（同一组镜像值）
#   左膝 8  +150 ≈ 18°     左髋 7  +60 ≈ 7°
#   右膝 3  -150 ≈ -18°    右髋 4  -60 ≈ -7°
#
# 步序：
#   1. 抬左腿（左膝抬、左髋微前）      右腿原地支撑
#   2. 左腿放下（回站立位）
#   3. 抬右腿（镜像值）
#   4. 右腿放下
#
# ⚠️ 整机只有两条腿，抬一条会失去平衡 —— 第一次跑请用手扶住机器人上半身，
#    或者把它放在桌边、用绳带吊住。确认姿态对称后再放手。

name: step
description: 原地交替踏步（四步一循环）
repeat: 1

steps:
  - name: 抬左腿（8 抬起 / 7 微前倾）
    moves:
      - {id: 8, pwm: 1650, duration_ms: 1200}
      - {id: 7, pwm: 1560, duration_ms: 1200}

  - name: 左腿放下
    moves:
      - {id: 8, pwm: 1500, duration_ms: 1200}
      - {id: 7, pwm: 1500, duration_ms: 1200}

  - name: 抬右腿（3 / 4 用镜像值）
    moves:
      - {id: 3, pwm: 1350, duration_ms: 1200}
      - {id: 4, pwm: 1440, duration_ms: 1200}

  - name: 右腿放下
    moves:
      - {id: 3, pwm: 1500, duration_ms: 1200}
      - {id: 4, pwm: 1500, duration_ms: 1200}
