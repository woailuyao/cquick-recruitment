# lift_left.yaml —— 抬左腿：抬起 → 保持 → 放下
#
# 与 step.yaml 的区别：step 是左右交替小幅抬，这个是**单腿抬到位并保持**，
# 幅度更大、能明显看出膝关节活动。
#
# 左腿三个关节（镜像：左侧 +）：
#   膝 8  +300 ≈ 36°   主抬升
#   髋 7  +120 ≈ 15°   配合前抬
#   踝 9  -80  ≈ -10°  脚尖自然下垂
# 右腿保持 1500 不动，作为支撑腿。
#
# ⚠️ 单腿抬起会让整机重心偏移 —— 第一次跑请用手扶住上半身，或用带子吊住。

name: lift_left
description: 抬起左腿 → 保持 → 放下（右腿支撑）
repeat: 3

steps:
  - name: 抬左腿（膝 +300 / 髋 +120 / 踝 -80）
    moves:
      - {id: 8, pwm: 1800, duration_ms: 1500}
      - {id: 7, pwm: 1620, duration_ms: 1500}
      - {id: 9, pwm: 1420, duration_ms: 1500}

  - name: 保持抬腿
    moves:
      - {id: 8, pwm: 1800, duration_ms: 1000}
      - {id: 7, pwm: 1620, duration_ms: 1000}
      - {id: 9, pwm: 1420, duration_ms: 1000}

  - name: 放下（三个关节回站立位）
    moves:
      - {id: 8, pwm: 1500, duration_ms: 1400}
      - {id: 7, pwm: 1500, duration_ms: 1400}
      - {id: 9, pwm: 1500, duration_ms: 1400}
