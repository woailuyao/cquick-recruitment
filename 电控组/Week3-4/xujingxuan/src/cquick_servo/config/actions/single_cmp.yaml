# single_cmp.yaml —— 单侧对比：先只动左腿大腿，再只动右腿大腿
#
# 用途：看两边舵机臂的转向是否一致，用来判断左右是不是镜像安装。
#   第 1-2 步：只动 7（左大腿）上去再回来
#   第 3-4 步：只动 4（右大腿）上去再回来
#
# 判断方法：
#   7 往上摆的方向 与 4 往上摆的方向
#     → 一致（都朝同一侧）= 同向安装
#     → 相反（一条前一条后）= 镜像安装

name: single_cmp
description: 单侧对比左右大腿转向
repeat: 1

steps:
  - name: 只动 7（左大腿）→ 1620
    moves:
      - {id: 7, pwm: 1620, duration_ms: 1200}

  - name: 7 回 1500
    moves:
      - {id: 7, pwm: 1500, duration_ms: 1200}

  - name: 只动 4（右大腿）→ 1620
    moves:
      - {id: 4, pwm: 1620, duration_ms: 1200}

  - name: 4 回 1500
    moves:
      - {id: 4, pwm: 1500, duration_ms: 1200}
