# 动作组：起立
# steps 是有序列表；一个 step 里的多个舵机同时下发，step 之间等 result 回来再进下一步。
name: stand_up
description: 两个关节先一起抬，再一起收到预备位

steps:
  - - id: 1
      pwm: 1700
      duration_ms: 900
    - id: 2
      pwm: 1600
      duration_ms: 900

  - - id: 1
      pwm: 1550
      duration_ms: 600
    - id: 2
      pwm: 1450
      duration_ms: 600

  - - id: 1
      pwm: 1500
      duration_ms: 500
    - id: 2
      pwm: 1500
      duration_ms: 500
