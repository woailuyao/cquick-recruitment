# ============================================================
# 动作组 01 · 起立（stand_up）
# ------------------------------------------------------------
# 换动作只改这个文件，不用动 sequence_player.py 一行代码。
# 现场随便换一份 yaml 就能跑，这是任务 3 的硬要求。
#
# 读法：
#   steps 是一个有序列表，从上到下依次执行；
#   同一个 step 里的 joints 是「同时下发」（并行）；
#   上一个 step 的所有 result 都回来了，才发下一个 step。
#   → 要「某个关节先动」，就给它单独开一个 step，别靠调 duration_ms 硬凑。
#
# ⚠️ 本文件按整机实扫结果写：在线 ID = 001~010 共 10 只。
#    id 与"哪个关节"的对应关系按你的实际装配填，改这里即可。
# ⚠️ 左右对称的关节，pwm 方向常常是相反的（一个 +、一个 -），别照着抄。
# ============================================================

name: stand_up
description: 从趴下到站立：全部回中位 → 前一组撑起 → 后一组跟上 → 站定

defaults:
  duration_ms: 1200        # 没写 duration 的关节用这个值

steps:
  # ① 先统一回中位。整机姿态的基准，任何动作组都建议以这一步开头：
  #    上电后各关节停在上次的位置，不先回中位就动作，等于带着未知偏移做动作。
  - name: 全部回中位
    joints:
      - {id: 1, pwm: 1500}
      - {id: 2, pwm: 1500}
      - {id: 3, pwm: 1500}
      - {id: 4, pwm: 1500}
      - {id: 5, pwm: 1500}
      - {id: 6, pwm: 1500}
      - {id: 7, pwm: 1500}
      - {id: 8, pwm: 1500}
      - {id: 9, pwm: 1500}
      - {id: 10, pwm: 1500}

  # ② 第一组（1~5）同时撑起。放同一个 step = 同时下发；
  #    分成两个 step 就会一个先一个后，结构上会互相等。
  - name: 第一组撑起
    joints:
      - {id: 1, pwm: 1680, duration_ms: 1000}
      - {id: 2, pwm: 1680, duration_ms: 1000}
      - {id: 3, pwm: 1680, duration_ms: 1000}
      - {id: 4, pwm: 1680, duration_ms: 1000}
      - {id: 5, pwm: 1680, duration_ms: 1000}

  # ③ 第二组（6~10）跟上。必须等 ② 的 result 全回来（播放器保证），
  #    否则第一组还没撑起来，第二组已经开始动，整机会往前栽。
  - name: 第二组跟上
    joints:
      - {id: 6, pwm: 1620, duration_ms: 900}
      - {id: 7, pwm: 1620, duration_ms: 900}
      - {id: 8, pwm: 1620, duration_ms: 900}
      - {id: 9, pwm: 1620, duration_ms: 900}
      - {id: 10, pwm: 1620, duration_ms: 900}

  # ④ 站定微调。duration 给长一点：动作幅度小，但要让重心稳下来，
  #    给太短会看到"到位后还在晃"。
  - name: 站定
    joints:
      - {id: 1, pwm: 1650, duration_ms: 1500}
      - {id: 2, pwm: 1650, duration_ms: 1500}
      - {id: 3, pwm: 1650, duration_ms: 1500}
      - {id: 4, pwm: 1650, duration_ms: 1500}
      - {id: 5, pwm: 1650, duration_ms: 1500}
      - {id: 6, pwm: 1600, duration_ms: 1500}
      - {id: 7, pwm: 1600, duration_ms: 1500}
      - {id: 8, pwm: 1600, duration_ms: 1500}
      - {id: 9, pwm: 1600, duration_ms: 1500}
      - {id: 10, pwm: 1600, duration_ms: 1500}
