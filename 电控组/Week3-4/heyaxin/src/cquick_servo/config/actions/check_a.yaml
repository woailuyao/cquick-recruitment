# ============================================================
# 分段自检（第一段 · 1~4 号关节）
# ------------------------------------------------------------
# check_all 一次跑 31 步，实机上串口每 10 步左右会被舵机电流打掉一次，
# 所以拆成三段跑：每段 3~4 个关节，跑完还能保住日志。
#
#   python3 ~/t1.py center                    # 先回中位
#   ros2 run cquick_servo sequence_player --action check_a
#
# 判据：每个关节三步（1500 → +40 → -40）全部 success=True，
#       且「是不是只有它自己在动」「方向对不对」。
# ============================================================

name: check_a
description: 第一段 · 1~4 号关节
defaults:
  duration_ms: 1200

steps:
  - name: "01 回中位"
    joints: [{id: 1, pwm: 1500}]
  - name: "01 正向 +40"
    joints: [{id: 1, pwm: 1540}]
  - name: "01 反向 -40"
    joints: [{id: 1, pwm: 1460}]

  - name: "02 回中位"
    joints: [{id: 2, pwm: 1500}]
  - name: "02 正向 +40"
    joints: [{id: 2, pwm: 1540}]
  - name: "02 反向 -40"
    joints: [{id: 2, pwm: 1460}]

  - name: "03 回中位"
    joints: [{id: 3, pwm: 1500}]
  - name: "03 正向 +40"
    joints: [{id: 3, pwm: 1540}]
  - name: "03 反向 -40"
    joints: [{id: 3, pwm: 1460}]

  - name: "04 回中位"
    joints: [{id: 4, pwm: 1500}]
  - name: "04 正向 +40"
    joints: [{id: 4, pwm: 1540}]
  - name: "04 反向 -40"
    joints: [{id: 4, pwm: 1460}]
  - name: 本段全部回中位
    joints:
      - {id: 1, pwm: 1500, duration_ms: 1500}
      - {id: 2, pwm: 1500, duration_ms: 1500}
      - {id: 3, pwm: 1500, duration_ms: 1500}
      - {id: 4, pwm: 1500, duration_ms: 1500}
