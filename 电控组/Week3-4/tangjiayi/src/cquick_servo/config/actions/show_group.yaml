# 四关节分步抬腿 -> 同时下压 -> 八关节回中位
# 时长统一 2500ms：实测 700~1500ms 时舵机走不完，读回只偏 ±10 步
name: show_group
description: 1&2 抬腿 -> 3&4 抬腿 -> 四关节同时下压 -> 八关节回中位（时长 2500ms）

steps:
  - name: 01_抬腿_1和2
    settle_ms: 2000
    joints: [{id: 1, pwm: 1700, duration_ms: 2500}, {id: 2, pwm: 1700, duration_ms: 2500}]

  - name: 02_抬腿_3和4
    settle_ms: 2000
    joints: [{id: 3, pwm: 1700, duration_ms: 2500}, {id: 4, pwm: 1700, duration_ms: 2500}]

  - name: 03_四关节同时下压
    settle_ms: 2000
    joints: [{id: 1, pwm: 1300, duration_ms: 2500}, {id: 2, pwm: 1300, duration_ms: 2500},
             {id: 3, pwm: 1300, duration_ms: 2500}, {id: 4, pwm: 1300, duration_ms: 2500}]

  - name: 04_八关节回中位
    settle_ms: 2000
    joints: [{id: 1, pwm: 1500, duration_ms: 2500}, {id: 2, pwm: 1500, duration_ms: 2500},
             {id: 3, pwm: 1500, duration_ms: 2500}, {id: 4, pwm: 1500, duration_ms: 2500},
             {id: 7, pwm: 1500, duration_ms: 2500}, {id: 8, pwm: 1500, duration_ms: 2500},
             {id: 9, pwm: 1500, duration_ms: 2500}, {id: 10, pwm: 1500, duration_ms: 2500}]
