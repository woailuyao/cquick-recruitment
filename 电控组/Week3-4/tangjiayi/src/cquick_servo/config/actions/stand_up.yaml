# 动作定义：stand_up（10 关节整机自下而上逐级微屈，再整体回中位）
#
# ID 分布（实测：从左下到右下 1→10）
#   左腿 1(踝) 2 3 4 5(髋)   |   右腿 6(髋) 7 8 9 10(踝)
#   左右镜像对：(1,10) (2,9) (3,8) (4,7) (5,6)
#
# 幅度 ±60（约 13°）：一次只动一对关节，电流小、不会顶到结构限位。
# 若两条腿摆向不一致（拧麻花），把 6~10 号的 pwm 镜像：3000 - pwm。
#
# 播放器认的字段：steps[] 串行；step.joints[] 同时下发；settle_ms 到位后多等。

name: stand_up
description: 10 关节自下而上逐级微屈 60 步，再整体回中位（整机自检 + 动作组演示）

steps:
  - name: 01_踝微屈
    settle_ms: 120
    joints: [{id: 1, pwm: 1560, duration_ms: 600}, {id: 10, pwm: 1560, duration_ms: 600}]

  - name: 02_第四节微屈
    settle_ms: 120
    joints: [{id: 2, pwm: 1560, duration_ms: 600}, {id: 9, pwm: 1560, duration_ms: 600}]

  - name: 03_第三节微屈
    settle_ms: 120
    joints: [{id: 3, pwm: 1560, duration_ms: 600}, {id: 8, pwm: 1560, duration_ms: 600}]

  - name: 04_第二节微屈
    settle_ms: 120
    joints: [{id: 4, pwm: 1560, duration_ms: 600}, {id: 7, pwm: 1560, duration_ms: 600}]

  - name: 05_髋部微屈
    settle_ms: 150
    joints: [{id: 5, pwm: 1560, duration_ms: 600}, {id: 6, pwm: 1560, duration_ms: 600}]

  # 收尾：10 个关节一起回中位，方便下一套动作从同一姿态开始
  - name: 06_全部回中位
    settle_ms: 250
    joints: [{id: 1, pwm: 1500, duration_ms: 900}, {id: 2, pwm: 1500, duration_ms: 900},
             {id: 3, pwm: 1500, duration_ms: 900}, {id: 4, pwm: 1500, duration_ms: 900},
             {id: 5, pwm: 1500, duration_ms: 900}, {id: 6, pwm: 1500, duration_ms: 900},
             {id: 7, pwm: 1500, duration_ms: 900}, {id: 8, pwm: 1500, duration_ms: 900},
             {id: 9, pwm: 1500, duration_ms: 900}, {id: 10, pwm: 1500, duration_ms: 900}]
