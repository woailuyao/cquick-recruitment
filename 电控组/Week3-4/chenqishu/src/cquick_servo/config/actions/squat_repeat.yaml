# ============================================================
# squat_repeat.yaml —— 蹲下 → 保持1秒 → 站起，重复3遍
# ------------------------------------------------------------
# 每个舵机的"蹲下位置"来自现场 PRAD 读回的真实值。
#
# 【要改就改这三处】
#   repeat: 3        整套动作重复几遍
#   duration_ms      蹲下/站起各用多久（1000 = 1 秒走到位）
#   hold_ms: 1000    蹲到位后保持几秒
#   moves 里的 pwm   每个舵机的蹲下位置
#
# 注意：hold_ms 是"保持姿势"这个动作本身的停顿，
#       不是用来代替 result 同步的 —— 蹲下、站起依然等 result 才走下一步。
#
# 舵机编号（按实物）：
#   右腿（脚→胯）：1 2 3 4 5      左腿（胯→脚）：6 7 8 9 0
#   膝（主力）：右3 / 左8   ；胯下（补偿）：右4 / 左7
# ============================================================
motion_name: squat_repeat

repeat: 3

steps:
  # 起点：全体回中位，保证每一遍都从同一个姿势开始
  - name: 全体回中位
    duration_ms: 800
    moves:
      - {id: 0, pwm: 1500}
      - {id: 1, pwm: 1500}
      - {id: 2, pwm: 1500}
      - {id: 3, pwm: 1500}
      - {id: 4, pwm: 1500}
      - {id: 5, pwm: 1500}
      - {id: 6, pwm: 1500}
      - {id: 7, pwm: 1500}
      - {id: 8, pwm: 1500}
      - {id: 9, pwm: 1500}

  # 蹲下：从 1500 走到各自实测的蹲下位置
  # pwm_min 已从 900 放宽到 800，所以 3 号用真实值 866（不用改成 900）
  - name: 蹲下
    duration_ms: 1000
    moves:
      - {id: 0, pwm: 1499}
      - {id: 1, pwm: 1495}
      - {id: 2, pwm: 1196}
      - {id: 3, pwm: 866}
      - {id: 4, pwm: 1245}
      - {id: 5, pwm: 1504}
      - {id: 6, pwm: 1479}
      - {id: 7, pwm: 1764}
      - {id: 8, pwm: 2042}
      - {id: 9, pwm: 1775}

  # 保持蹲姿 1 秒：不发新指令，只是停住
  - name: 保持蹲姿1秒
    hold_ms: 1000
    moves: []

  # 站起：全部回中位
  - name: 站起
    duration_ms: 1000
    moves:
      - {id: 0, pwm: 1500}
      - {id: 1, pwm: 1500}
      - {id: 2, pwm: 1500}
      - {id: 3, pwm: 1500}
      - {id: 4, pwm: 1500}
      - {id: 5, pwm: 1500}
      - {id: 6, pwm: 1500}
      - {id: 7, pwm: 1500}
      - {id: 8, pwm: 1500}
      - {id: 9, pwm: 1500}
