# 动作组：双腿蹲下 → 起立
#
# ===== 舵机编号与关节对应（按实物）=====
#   右腿（脚 → 胯）：1   2   3   4   5
#   左腿（胯 → 脚）：6   7   8   9   0
#
#   脚       : 右1 / 左0       蹲下时几乎不动
#   膝下     : 右2 / 左9       伴随膝盖转动
#   膝（主力）: 右3 / 左8       蹲下时变化最大（634 / 542）
#   胯下     : 右4 / 左7       膝盖弯下去后做补偿，让躯干保持直立
#   胯       : 右5 / 左6       几乎不动
#
# ===== 设计要点（README 第 9 条要用）=====
#   1. 第一步固定回「站立全 1500」：每次播放起点一致，连跑三遍才一样
#   2. 膝盖组（2,3,8,9）先动 —— 物理顺序上必须先屈膝
#   3. 胯下组（4,7）后动 —— 膝盖到位后再把躯干拉直
#   4. 蹲下分「半蹲 → 全蹲」两段：一次跳 634 太猛，电流和机械冲击都大
#   5. 起立是蹲下的镜像：躯干先回正，膝盖再伸
#   6. step 之间等 result 回来才发下一步（播放器保证），不靠 sleep

name: squat

steps:
  # ---------- ① 起点：站立 ----------
  - name: 站立
    joints:
      - {id: 0, pwm: 1500, duration_ms: 800}   # 左脚
      - {id: 1, pwm: 1500, duration_ms: 800}   # 右脚
      - {id: 2, pwm: 1500, duration_ms: 800}   # 右膝下
      - {id: 3, pwm: 1500, duration_ms: 800}   # 右膝
      - {id: 4, pwm: 1500, duration_ms: 800}   # 右胯下
      - {id: 5, pwm: 1500, duration_ms: 800}   # 右胯
      - {id: 6, pwm: 1500, duration_ms: 800}   # 左胯
      - {id: 7, pwm: 1500, duration_ms: 800}   # 左胯下
      - {id: 8, pwm: 1500, duration_ms: 800}   # 左膝
      - {id: 9, pwm: 1500, duration_ms: 800}   # 左膝下

  # ---------- ② 半蹲：膝盖走一半，缓冲 ----------
  - name: 半蹲
    joints:
      - {id: 2, pwm: 1348, duration_ms: 900}   # 1500 → 1196 的中点
      - {id: 3, pwm: 1183, duration_ms: 900}   # 1500 →  866 的中点
      - {id: 8, pwm: 1771, duration_ms: 900}   # 1500 → 2042 的中点
      - {id: 9, pwm: 1637, duration_ms: 900}   # 1500 → 1775 的中点

  # ---------- ③ 全蹲：膝盖到位 ----------
  - name: 屈膝到底
    joints:
      - {id: 2, pwm: 1196, duration_ms: 1200}
      - {id: 3, pwm: 866, duration_ms: 1200}
      - {id: 8, pwm: 2042, duration_ms: 1200}
      - {id: 9, pwm: 1775, duration_ms: 1200}

  # ---------- ④ 躯干补偿：把上身拉直 ----------
  - name: 躯干补偿
    joints:
      - {id: 4, pwm: 1245, duration_ms: 900}
      - {id: 7, pwm: 1764, duration_ms: 900}

  # ---------- ⑤ 起立准备：躯干先回正 ----------
  - name: 躯干回正
    joints:
      - {id: 4, pwm: 1500, duration_ms: 800}
      - {id: 7, pwm: 1500, duration_ms: 800}

  # ---------- ⑥ 伸腿起立：膝盖回位 ----------
  - name: 伸腿起立
    joints:
      - {id: 2, pwm: 1500, duration_ms: 1200}
      - {id: 3, pwm: 1500, duration_ms: 1200}
      - {id: 8, pwm: 1500, duration_ms: 1200}
      - {id: 9, pwm: 1500, duration_ms: 1200}
