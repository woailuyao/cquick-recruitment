# ============================================================
# step.yaml —— 左右交替抬脚（踏步），用来演示"换一套 yaml 就是换一套动作"
# ------------------------------------------------------------
# 和 squat_repeat.yaml 的区别：
#   squat  : 双腿同时屈膝，躯干补偿
#   step   : 一条腿抬、另一条腿保持，左右交替
#
# 沿用同一套播放器和同一份代码，python 一行不改。
#
# 舵机编号（按实物）：
#   右腿（脚→胯）：1 2 3 4 5      左腿（胯→脚）：6 7 8 9 0
#   膝（主力）：右3 / 左8        膝下：右2 / 左9
#   注意左右镜像：右膝"弯"是 pwm 变小，左膝"弯"是 pwm 变大
# ============================================================
motion_name: step

repeat: 2

steps:
  # 起点：全体回中位
  - name: 全体回中位
    duration_ms: 700
    moves:
      - {id: 0, pwm: 1500}
      - {id: 1, pwm: 1500}
      - {id: 2, pwm: 1500}
      - {id: 3, pwm: 1500}
      - {id: 4, pwm: 1500}
      - {id: 5, pwm: 1500}
      - {id: 6, pwm: 1500}
      - {id: 7, pwm: 1500}
      - {id: 8, pwm: 1500}
      - {id: 9, pwm: 1500}

  # ① 抬右腿：右膝（3）和右膝下（2）一起弯，左腿保持 1500 支撑
  - name: 抬右脚
    duration_ms: 900
    moves:
      - {id: 3, pwm: 1150}     # 右膝弯曲
      - {id: 2, pwm: 1300}     # 右膝下配合

  # ② 放下右脚
  - name: 放下右脚
    duration_ms: 900
    moves:
      - {id: 3, pwm: 1500}
      - {id: 2, pwm: 1500}

  # ③ 抬左脚：左膝（8）弯，方向相反（pwm 变大）
  - name: 抬左脚
    duration_ms: 900
    moves:
      - {id: 8, pwm: 1850}     # 左膝弯曲
      - {id: 9, pwm: 1700}     # 左膝下配合

  # ④ 放下左脚
  - name: 放下左脚
    duration_ms: 900
    moves:
      - {id: 8, pwm: 1500}
      - {id: 9, pwm: 1500}

  # ⑤ 收尾：双腿小幅蹲一下再站起，确认回到站立
  - name: 收尾微蹲
    duration_ms: 800
    moves:
      - {id: 2, pwm: 1400}
      - {id: 3, pwm: 1250}
      - {id: 8, pwm: 1600}
      - {id: 9, pwm: 1550}

  - name: 站直
    duration_ms: 800
    moves:
      - {id: 0, pwm: 1500}
      - {id: 1, pwm: 1500}
      - {id: 2, pwm: 1500}
      - {id: 3, pwm: 1500}
      - {id: 4, pwm: 1500}
      - {id: 5, pwm: 1500}
      - {id: 6, pwm: 1500}
      - {id: 7, pwm: 1500}
      - {id: 8, pwm: 1500}
      - {id: 9, pwm: 1500}
