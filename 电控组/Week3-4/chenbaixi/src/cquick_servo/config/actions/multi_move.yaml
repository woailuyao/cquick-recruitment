name: multi_move
default_duration_ms: 800
steps:
  - name: 两舵机同时正转
    commands:
      - {id: 1, pwm: 1550, duration_ms: 800}
      - {id: 0, pwm: 1550, duration_ms: 800}
  - name: 两舵机同时反转
    commands:
      - {id: 1, pwm: 1450, duration_ms: 800}
      - {id: 0, pwm: 1450, duration_ms: 800}
  - name: 两舵机回中位
    commands:
      - {id: 1, pwm: 1500, duration_ms: 800}
      - {id: 0, pwm: 1500, duration_ms: 800}
