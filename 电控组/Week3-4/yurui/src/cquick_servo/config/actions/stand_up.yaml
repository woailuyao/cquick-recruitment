# ============================================================
# stand_up.yaml —— 蹲下 → 保持1秒 → 站起，重复3次
# ------------------------------------------------------------
# 每个舵机的"蹲下位置"来自现场 PRAD 读回的真实值（见下面 moves）。
#
# 【你要改的话，就改这三处】
#   repeat: 3        整套动作重复几遍
#   duration_ms      蹲下/站起各用多久（1000 = 1秒走到位）
#   hold_ms: 1000    蹲到位后保持几秒（这就是"等待1秒"）
#   moves 里的 pwm   每个舵机的蹲下位置（已经按你测的填好）
#
# 注意：这里的 hold_ms 是"保持姿势1秒"这个动作本身要的停顿，
#       不是用来代替 result 同步的 —— 蹲下、站起依然是等 result 才走下一步。
# ============================================================
motion_name: stand_up

# 整套动作重复几遍
repeat: 3

steps:
  # 起点：全体回中位 1500，保证每一遍都从同一个姿势开始
  - name: "全体回中位(起点)"
    duration_ms: 800
    moves:
      - {id: 0, pwm: 1500}
      - {id: 1, pwm: 1500}
      - {id: 2, pwm: 1500}
      - {id: 3, pwm: 1500}
      - {id: 4, pwm: 1500}
      - {id: 5, pwm: 1500}
      - {id: 6, pwm: 1500}
      - {id: 7, pwm: 1500}
      - {id: 8, pwm: 1500}
      - {id: 9, pwm: 1500}

  # 蹲下：从 1500 走到各自的蹲下位置（你实测的值）
  - name: "蹲下"
    duration_ms: 1000
    moves:
      - {id: 0, pwm: 1499}
      - {id: 1, pwm: 1495}
      - {id: 2, pwm: 1196}
      - {id: 3, pwm: 900}       # 原测值866低于pwm_min=900，调到最近边界900
      - {id: 4, pwm: 1245}
      - {id: 5, pwm: 1504}
      - {id: 6, pwm: 1479}
      - {id: 7, pwm: 1764}
      - {id: 8, pwm: 2042}
      - {id: 9, pwm: 1775}

  # 保持蹲姿1秒：这一步不发新指令，只是停住（等待1秒）
  - name: "保持蹲姿1秒"
    hold_ms: 1000
    moves: []

  # 站起：全部回到 1500
  - name: "站起"
    duration_ms: 1000
    moves:
      - {id: 0, pwm: 1500}
      - {id: 1, pwm: 1500}
      - {id: 2, pwm: 1500}
      - {id: 3, pwm: 1500}
      - {id: 4, pwm: 1500}
      - {id: 5, pwm: 1500}
      - {id: 6, pwm: 1500}
      - {id: 7, pwm: 1500}
      - {id: 8, pwm: 1500}
      - {id: 9, pwm: 1500}
