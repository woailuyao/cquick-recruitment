# walk.yaml —— 走动步态（★ 用咱们自己的 steps/moves 格式，sequence_player.py 直接能读）
#
# 格式说明：和 stand_up.yaml / wave.yaml 完全一样——
#   motion_name : 动作名
#   repeat      : 整套重复几遍（走动要连着走才像走，这里 3 遍）
#   steps       : 一步一步的动作；每步 name + duration_ms + moves[{id,pwm}]
#   moves 里的舵机在同一步内【同时下发、同时起步】，不用 -114 那种分隔符。
#
# 中位基准 = PRAD 读回的真实站立位置（不许再用 1500 一把梭）：
#   0=1481  1=1500  2=1464  3=1301  4=1495
#   5=1504  6=1495  7=1798  8=1794  9=1510
#
# 步态：A组(偶数 0,2,4,6,8) 与 B组(奇数 1,3,5,7,9) 交替抬起
#   回中位 → A抬 → A落 → B抬 → B落 = 一个步态周期
#   没写进 moves 的那组舵机保持原位不动（撑住），正好形成对角步态。
#
# ★ 上机注意：
#   1) 幅度先小（现在偏移 70），确认不刮线、不摔倒再加大
#   2) 若某条腿"抬起来其实是往下压"，把那条的 中位-70 改成 中位+70
#   3) 若分组不对（A/B 不是对角腿），把两组的 ID 对调即可
# ============================================================
motion_name: walk

# 整套动作重复几遍（走动建议多跑几遍）
repeat: 3

steps:
  # 阶段0：全体回中位（起点），2 秒站稳
  - name: "全体回中位(起点)"
    duration_ms: 2000
    moves:
      - {id: 0, pwm: 1500}
      - {id: 1, pwm: 1500}
      - {id: 2, pwm: 1500}
      - {id: 3, pwm: 1500}
      - {id: 4, pwm: 1500}
      - {id: 5, pwm: 1500}
      - {id: 6, pwm: 1500}
      - {id: 7, pwm: 1500}
      - {id: 8, pwm: 1500}
      - {id: 9, pwm: 1500}

  # 阶段1：A组抬起（中位-70），B组保持中位撑住
  - name: "A组抬起(0,2,4,6,8)"
    duration_ms: 800
    moves:
      - {id: 0, pwm: 1411}
      - {id: 2, pwm: 1394}
      - {id: 4, pwm: 1425}
      - {id: 6, pwm: 1425}
      - {id: 8, pwm: 1724}

  # 阶段2：A组落回中位
  - name: "A组落回中位"
    duration_ms: 800
    moves:
      - {id: 0, pwm: 1500}
      - {id: 2, pwm: 1500}
      - {id: 4, pwm: 1500}
      - {id: 6, pwm: 1500}
      - {id: 8, pwm: 1500}

  # 阶段3：B组抬起（中位-70），A组保持中位撑住
  - name: "B组抬起(1,3,5,7,9)"
    duration_ms: 800
    moves:
      - {id: 1, pwm: 1430}
      - {id: 3, pwm: 1231}
      - {id: 5, pwm: 1434}
      - {id: 7, pwm: 1728}
      - {id: 9, pwm: 1440}

  # 阶段4：B组落回中位，完成一个步态周期
  - name: "B组落回中位"
    duration_ms: 800
    moves:
      - {id: 1, pwm: 1500}
      - {id: 3, pwm: 1500}
      - {id: 5, pwm: 1500}
      - {id: 7, pwm: 1500}
      - {id: 9, pwm: 1500}
