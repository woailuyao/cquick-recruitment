name: stand_up
description: 起立 —— 从下往上逐层抬起，回位时从上往下逐层落下
steps:
  - name: 第1层（1、4 镜像）
    moves:
      - {id: 1, pwm: 1640, duration_ms: 1000}
      - {id: 4, pwm: 1360, duration_ms: 1000}

  - name: 第2层（3、2 同向）
    moves:
      - {id: 3, pwm: 1635, duration_ms: 1000}
      - {id: 2, pwm: 1635, duration_ms: 1000}

  - name: 第3层（5、6 同向）
    moves:
      - {id: 5, pwm: 1630, duration_ms: 1000}
      - {id: 6, pwm: 1630, duration_ms: 1000}

  - name: 第4层（7、8 同向）
    moves:
      - {id: 7, pwm: 1625, duration_ms: 1000}
      - {id: 8, pwm: 1625, duration_ms: 1000}

  - name: 第5层（9、10 镜像）
    moves:
      - {id: 9, pwm: 1380, duration_ms: 1000}
      - {id: 10, pwm: 1380, duration_ms: 1000}

  - name: 第5层先落（9、10）
    moves:
      - {id: 9, pwm: 1500, duration_ms: 1000}
      - {id: 10, pwm: 1500, duration_ms: 1000}

  - name: 第4层落（7、8）
    moves:
      - {id: 7, pwm: 1500, duration_ms: 1000}
      - {id: 8, pwm: 1500, duration_ms: 1000}

  - name: 第3层落（5、6）
    moves:
      - {id: 5, pwm: 1500, duration_ms: 1000}
      - {id: 6, pwm: 1500, duration_ms: 1000}

  - name: 第2层落（3、2）
    moves:
      - {id: 3, pwm: 1500, duration_ms: 1000}
      - {id: 2, pwm: 1500, duration_ms: 1000}

  - name: 第1层落（1、4）
    moves:
      - {id: 1, pwm: 1500, duration_ms: 1000}
      - {id: 4, pwm: 1500, duration_ms: 1000}
