name: stand_up
description: "two-joint stand up"
steps:
  - {name: prepare, moves: [{servo_id: 1, target_pwm: 1350, duration_ms: 1600}, {servo_id: 0, target_pwm: 1650, duration_ms: 1600}]}
  - {name: lift, moves: [{servo_id: 1, target_pwm: 1200, duration_ms: 1800}, {servo_id: 0, target_pwm: 1800, duration_ms: 1800}]}
  - {name: joint1_center, moves: [{servo_id: 1, target_pwm: 1500, duration_ms: 1500}]}
  - {name: joint2_center, moves: [{servo_id: 0, target_pwm: 1500, duration_ms: 1500}]}
