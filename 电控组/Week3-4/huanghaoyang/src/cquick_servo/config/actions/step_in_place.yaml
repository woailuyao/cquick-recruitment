name: step_in_place
description: 原地踏步（先移重心，再抬腿）

steps:
  - name: 站立
    duration_ms: 900
    servos:
      - {id: 101, pwm: 1500}
      - {id: 102, pwm: 1500}
      - {id: 103, pwm: 1500}
      - {id: 104, pwm: 1500}
      - {id: 105, pwm: 1500}
      - {id: 106, pwm: 1500}
      - {id: 107, pwm: 1500}
      - {id: 108, pwm: 1500}
      - {id: 109, pwm: 1500}
      - {id: 110, pwm: 1500}

  - name: 重心移右
    duration_ms: 1000
    servos:
      - {id: 109, pwm: 1540}
      - {id: 110, pwm: 1540}
      - {id: 101, pwm: 1460}
      - {id: 102, pwm: 1540}

  - name: 抬左腿
    duration_ms: 1100
    servos:
      - {id: 108, pwm: 1250}
      - {id: 106, pwm: 1200}
      - {id: 104, pwm: 1600}

  - name: 放左腿
    duration_ms: 1100
    servos:
      - {id: 108, pwm: 1500}
      - {id: 106, pwm: 1500}
      - {id: 104, pwm: 1500}

  - name: 重心移左
    duration_ms: 1000
    servos:
      - {id: 109, pwm: 1460}
      - {id: 110, pwm: 1460}
      - {id: 101, pwm: 1540}
      - {id: 102, pwm: 1460}

  - name: 抬右腿
    duration_ms: 1100
    servos:
      - {id: 107, pwm: 1750}
      - {id: 105, pwm: 1800}
      - {id: 103, pwm: 1400}

  - name: 放右腿
    duration_ms: 1100
    servos:
      - {id: 107, pwm: 1500}
      - {id: 105, pwm: 1500}
      - {id: 103, pwm: 1500}

  - name: 回到中间
    duration_ms: 1000
    servos:
      - {id: 101, pwm: 1500}
      - {id: 102, pwm: 1500}
      - {id: 109, pwm: 1500}
      - {id: 110, pwm: 1500}
