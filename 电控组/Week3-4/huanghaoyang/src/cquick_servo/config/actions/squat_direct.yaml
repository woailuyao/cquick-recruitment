name: squat_direct
description: 直接蹲下（第一步不回中位），用于抢占演示

steps:
  - name: 直接蹲下
    duration_ms: 1600
    servos:
      - {id: 107, pwm: 1960}
      - {id: 108, pwm: 1000}
      - {id: 105, pwm: 1700}
      - {id: 106, pwm: 1300}
      - {id: 103, pwm: 1685}
      - {id: 104, pwm: 1315}

  - name: 保持蹲姿
    duration_ms: 900
    servos:
      - {id: 107, pwm: 1960}
      - {id: 108, pwm: 1000}
      - {id: 105, pwm: 1700}
      - {id: 106, pwm: 1300}
      - {id: 103, pwm: 1685}
      - {id: 104, pwm: 1315}

  - name: 站起
    duration_ms: 1600
    servos:
      - {id: 103, pwm: 1500}
      - {id: 104, pwm: 1500}
      - {id: 105, pwm: 1500}
      - {id: 106, pwm: 1500}
      - {id: 107, pwm: 1500}
      - {id: 108, pwm: 1500}
