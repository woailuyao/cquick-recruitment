name: stand_squat
description: 站立 -> 蹲下 -> 站起（实测姿态）

steps:
  - name: 站立
    duration_ms: 900
    servos:
      - {id: 103, pwm: 1500}
      - {id: 104, pwm: 1500}
      - {id: 105, pwm: 1500}
      - {id: 106, pwm: 1500}
      - {id: 107, pwm: 1500}
      - {id: 108, pwm: 1500}

  - name: 蹲下
    duration_ms: 1600
    servos:
      - {id: 107, pwm: 2000}
      - {id: 108, pwm: 1000}
      - {id: 105, pwm: 1700}
      - {id: 106, pwm: 1300}
      - {id: 103, pwm: 1685}
      - {id: 104, pwm: 1315}

  - name: 站起
    duration_ms: 1600
    servos:
      - {id: 103, pwm: 1500}
      - {id: 104, pwm: 1500}
      - {id: 105, pwm: 1500}
      - {id: 106, pwm: 1500}
      - {id: 107, pwm: 1500}
      - {id: 108, pwm: 1500}
