name: pair12_demo
description: 只用 1/2 号舵机做外扩和收回，3/4 保持不动
default_duration_ms: 1200

servos:
  1: {invert: false, pwm_min: 1400, pwm_max: 1600}
  2: {invert: false, pwm_min: 1400, pwm_max: 1500}

steps:
  - name: home_12
    actions:
      - {id: 1, pwm: 1500, duration_ms: 1200}
      - {id: 2, pwm: 1500, duration_ms: 1200}

  - name: extend_small
    actions:
      - {id: 1, pwm: 1550, duration_ms: 1200}
      - {id: 2, pwm: 1450, duration_ms: 1200}

  - name: back_home_1
    actions:
      - {id: 1, pwm: 1500, duration_ms: 1200}
      - {id: 2, pwm: 1500, duration_ms: 1200}

  - name: extend_big
    actions:
      - {id: 1, pwm: 1600, duration_ms: 1500}
      - {id: 2, pwm: 1400, duration_ms: 1500}

  - name: back_home_2
    actions:
      - {id: 1, pwm: 1500, duration_ms: 1500}
      - {id: 2, pwm: 1500, duration_ms: 1500}
