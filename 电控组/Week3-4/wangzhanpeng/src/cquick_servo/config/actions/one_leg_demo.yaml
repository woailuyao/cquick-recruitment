name: one_leg_demo
description: 单腿演示：1/2 成对外扩，3/4 成对前后摆
default_duration_ms: 1200

servos:
  1: {invert: false, pwm_min: 1400, pwm_max: 1600}
  2: {invert: false, pwm_min: 1400, pwm_max: 1500}
  3: {invert: false, pwm_min: 1400, pwm_max: 1600}
  4: {invert: false, pwm_min: 1400, pwm_max: 1600}

steps:
  - name: home_all
    actions:
      - {id: 1, pwm: 1500, duration_ms: 1500}
      - {id: 2, pwm: 1500, duration_ms: 1500}
      - {id: 3, pwm: 1500, duration_ms: 1500}
      - {id: 4, pwm: 1500, duration_ms: 1500}

  - name: extend_out
    actions:
      - {id: 1, pwm: 1600, duration_ms: 1500}
      - {id: 2, pwm: 1400, duration_ms: 1500}

  - name: swing_forward
    actions:
      - {id: 3, pwm: 1400, duration_ms: 1200}
      - {id: 4, pwm: 1600, duration_ms: 1200}

  - name: swing_back
    actions:
      - {id: 3, pwm: 1600, duration_ms: 1200}
      - {id: 4, pwm: 1400, duration_ms: 1200}

  - name: swing_forward_2
    actions:
      - {id: 3, pwm: 1400, duration_ms: 1200}
      - {id: 4, pwm: 1600, duration_ms: 1200}

  - name: swing_back_2
    actions:
      - {id: 3, pwm: 1600, duration_ms: 1200}
      - {id: 4, pwm: 1400, duration_ms: 1200}

  - name: home_again
    actions:
      - {id: 1, pwm: 1500, duration_ms: 1500}
      - {id: 2, pwm: 1500, duration_ms: 1500}
      - {id: 3, pwm: 1500, duration_ms: 1500}
      - {id: 4, pwm: 1500, duration_ms: 1500}
