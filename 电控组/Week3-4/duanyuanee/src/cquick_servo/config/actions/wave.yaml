# 动作组：挥手 (wave)
# 与 stand_up.yaml 同结构：换这套动作只改 yaml，播放器代码不变。
name: wave
description: 单舵机往复挥手，连做两个来回后回中位
steps:
  - name: 抬手
    commands:
      - {id: 1, pwm: 1900, duration_ms: 600}
  - name: 挥下
    commands:
      - {id: 1, pwm: 1100, duration_ms: 600}
  - name: 再抬手
    commands:
      - {id: 1, pwm: 1900, duration_ms: 600}
  - name: 再挥下
    commands:
      - {id: 1, pwm: 1100, duration_ms: 600}
  - name: 回中位
    commands:
      - {id: 1, pwm: 1500, duration_ms: 800}
