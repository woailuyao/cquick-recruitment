name: up_and_down
description: 蹲下起立重复两次
steps:
  - name: 蹲下
    servos:
      - {id: 3, pwm: 1710, duration_ms: 800}
      - {id: 4, pwm: 1290, duration_ms: 800}
      - {id: 5, pwm: 1220, duration_ms: 800}
      - {id: 6, pwm: 1720, duration_ms: 800}
  - name: 起立
    servos:
      - {id: 3, pwm: 1500, duration_ms: 1500}
      - {id: 4, pwm: 1500, duration_ms: 1500}
      - {id: 5, pwm: 1500, duration_ms: 1500}
      - {id: 6, pwm: 1500, duration_ms: 1500}


