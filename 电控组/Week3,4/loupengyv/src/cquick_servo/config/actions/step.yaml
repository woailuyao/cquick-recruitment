    joints:
      - {id: 1, pwm: 1540, duration_ms: 700}
      - {id: 2, pwm: 1460, duration_ms: 700}
      - {id: 3, pwm: 1540, duration_ms: 700}
      - {id: 4, pwm: 1460, duration_ms: 700}
      - {id: 5, pwm: 1540, duration_ms: 700}
