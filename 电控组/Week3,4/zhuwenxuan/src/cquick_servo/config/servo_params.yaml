servo_driver:
  ros__parameters:
    # 串口（换硬件只改这里，或 launch 时 port:=/dev/ttyUSB1 覆盖）
    port: /dev/ttyUSB0
    baudrate: 115200
    # 结构实测的安全范围（电气极限是 500~2500，这里先按常规取值，装结构后按实测改）
    pwm_min: 900
    pwm_max: 2100
    default_duration_ms: 800
    # 本机有哪些舵机（不在列表里的 ID 一律拒绝）
    servo_ids: [1, 2, 3, 4, 5, 6]
    # 启动时是否全部回中位
    startup_reset: true
