# 动作 2：原地踏步（两轮）
# 抬腿 = 前后摆 +200 同时屈膝 -150
name: wave
steps:
  - name: 抬右腿
    moves:
      - {id: 7, pwm: 1700, duration_ms: 1200}
      - {id: 5, pwm: 1280, duration_ms: 1200}
  - name: 右腿放下
    moves:
      - {id: 7, pwm: 1500, duration_ms: 1200}
      - {id: 5, pwm: 1200, duration_ms: 1200}
  - name: 抬左腿
    moves:
      - {id: 8, pwm: 1700, duration_ms: 1200}
      - {id: 6, pwm: 1280, duration_ms: 1200}
  - name: 左腿放下
    moves:
      - {id: 8, pwm: 1500, duration_ms: 1200}
      - {id: 6, pwm: 1200, duration_ms: 1200}
  - name: 再抬右腿
    moves:
      - {id: 7, pwm: 1700, duration_ms: 1200}
      - {id: 5, pwm: 1280, duration_ms: 1200}
  - name: 右腿放下
    moves:
      - {id: 7, pwm: 1500, duration_ms: 1200}
      - {id: 5, pwm: 1200, duration_ms: 1200}
  - name: 再抬左腿
    moves:
      - {id: 8, pwm: 1700, duration_ms: 1200}
      - {id: 6, pwm: 1280, duration_ms: 1200}
  - name: 左腿放下
    moves:
      - {id: 8, pwm: 1500, duration_ms: 1200}
      - {id: 6, pwm: 1200, duration_ms: 1200}