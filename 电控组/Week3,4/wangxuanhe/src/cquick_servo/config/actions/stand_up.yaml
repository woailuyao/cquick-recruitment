# 动作组：起身
# 结构：一套动作 = 若干 step 组成的有序列表；每个 step = 若干条「哪个舵机 / 目标 PWM / 用多久」
# 语义：step 内多关节 = 同时下发（并行）；step 之间 = 等上一步 result 全回来才发下一步
#
# ⚠️ id 与关节的对应关系、pwm 的具体数值，请按你整机的结构实测后改这里，不要改 python。
#    这里给的是保守小幅动作，只用于验证「数据驱动 + result 同步」，正式演示前必须按结构校一遍。

name: stand_up
description: 从蹲姿到站起，演示 step 内并行 + step 间串行

default_duration_ms: 800

steps:
  - name: 屈膝蓄力
    joints:
      - {id: 1, pwm: 1380, duration_ms: 700}
      - {id: 2, pwm: 1380, duration_ms: 700}

  - name: 双髋同步抬起
    joints:
      - {id: 1, pwm: 1620, duration_ms: 900}
      - {id: 2, pwm: 1620, duration_ms: 900}

  - name: 踝关节回正
    joints:
      - {id: 5, pwm: 1500, duration_ms: 600}
      - {id: 6, pwm: 1500, duration_ms: 600}

  - name: 站稳保持
    joints:
      - {id: 3, pwm: 1500, duration_ms: 500}
      - {id: 4, pwm: 1500, duration_ms: 500}
