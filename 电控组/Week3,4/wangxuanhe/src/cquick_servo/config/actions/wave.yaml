# 动作组：挥手
# 演示三件事：
#   1) 同一 step 内两个关节并行（抬肩 + 翻腕同时走）
#   2) 一步之内要有先后 → 拆成两个 step，而不是靠调 duration_ms 硬凑
#   3) 摆三次 = 三个 step 交替，靠 result 串起来，连跑三遍动作一致
#
# ⚠️ id 与关节对应关系、pwm 数值按你整机实测调整。

name: wave
description: 抬右臂、手腕左右摆动三次、放下

default_duration_ms: 600

steps:
  - name: 抬肩并同时翻腕（并行）
    joints:
      - {id: 1, pwm: 1720, duration_ms: 800}
      - {id: 2, pwm: 1650, duration_ms: 800}

  - name: 摆外 1
    joints:
      - {id: 2, pwm: 1780, duration_ms: 400}

  - name: 摆内 1
    joints:
      - {id: 2, pwm: 1380, duration_ms: 400}

  - name: 摆外 2
    joints:
      - {id: 2, pwm: 1780, duration_ms: 400}

  - name: 摆内 2
    joints:
      - {id: 2, pwm: 1380, duration_ms: 400}

  - name: 摆外 3
    joints:
      - {id: 2, pwm: 1780, duration_ms: 400}

  - name: 回腕
    joints:
      - {id: 2, pwm: 1500, duration_ms: 400}

  - name: 放下右臂
    joints:
      - {id: 1, pwm: 1500, duration_ms: 800}
