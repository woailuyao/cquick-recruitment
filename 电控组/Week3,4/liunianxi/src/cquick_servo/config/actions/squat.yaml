# 动作组：蹲起（腿式机构，10 个舵机；用来演示“不改代码只换 yaml”）
# 关节语义：1/2 踝（脚部侧向）、3~8 腿（弯曲）、9/10 髋（张合）
# 注意：本板固件忽略 T<1000 的移动指令，所以每一步的 duration_ms 都写 >=1000。
name: squat
repeat: 2
steps:
  - name: 下蹲（腿弯曲 ±80，髋内收 ±30；±100 时 id=5 会顶到极限，见调试记录）
    joints:
      - {id: 3, pwm: 1580, duration_ms: 1200}
      - {id: 4, pwm: 1420, duration_ms: 1200}
      - {id: 5, pwm: 1580, duration_ms: 1200}
      - {id: 6, pwm: 1420, duration_ms: 1200}
      - {id: 7, pwm: 1580, duration_ms: 1200}
      - {id: 8, pwm: 1420, duration_ms: 1200}
      - {id: 9, pwm: 1530, duration_ms: 1200}
      - {id: 10, pwm: 1470, duration_ms: 1200}

  - name: 脚踝向外翻一下（1、2 反向各 50）
    joints:
      - {id: 1, pwm: 1550, duration_ms: 1000}
      - {id: 2, pwm: 1450, duration_ms: 1000}

  - name: 起身（腿、髋、踝全部回中位）
    joints:
      - {id: 1, pwm: 1500, duration_ms: 1200}
      - {id: 2, pwm: 1500, duration_ms: 1200}
      - {id: 3, pwm: 1500, duration_ms: 1200}
      - {id: 4, pwm: 1500, duration_ms: 1200}
      - {id: 5, pwm: 1500, duration_ms: 1200}
      - {id: 6, pwm: 1500, duration_ms: 1200}
      - {id: 7, pwm: 1500, duration_ms: 1200}
      - {id: 8, pwm: 1500, duration_ms: 1200}
      - {id: 9, pwm: 1500, duration_ms: 1200}
      - {id: 10, pwm: 1500, duration_ms: 1200}
