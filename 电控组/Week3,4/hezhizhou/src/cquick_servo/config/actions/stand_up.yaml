# pwm 为占位值，需按实测安全区间调整
name: stand_up
description: 前肢先抬，后肢再收，最后全部回中位

steps:
  - name: 抬前肢
    joints:
      - {id: 0, pwm: 1300, duration_ms: 800}
      - {id: 1, pwm: 1300, duration_ms: 800}

  - name: 收后肢
    joints:
      - {id: 2, pwm: 1700, duration_ms: 800}
      - {id: 3, pwm: 1700, duration_ms: 800}

  - name: 全部回中位
    joints:
      - {id: 0, pwm: 1500, duration_ms: 600}
      - {id: 1, pwm: 1500, duration_ms: 600}
      - {id: 2, pwm: 1500, duration_ms: 600}
      - {id: 3, pwm: 1500, duration_ms: 600}
