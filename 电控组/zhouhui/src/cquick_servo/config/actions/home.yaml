# 初始站姿：全部 1500 中立位。
# 和 driver 的 startup_reset 是同一个姿态，这里做成数据，以后换站姿只改这个文件。
# step 内一次下发全部关节（并行），所以整机同时起，不会互相拽。
name: home
description: 整机 1500 中立位站姿
default_duration_ms: 3000

steps:
  - label: 全机回中立位
    moves:
      - {id: 1, pwm: 1500, duration_ms: 3000}
      - {id: 2, pwm: 1500, duration_ms: 3000}
      - {id: 3, pwm: 1500, duration_ms: 3000}
      - {id: 4, pwm: 1500, duration_ms: 3000}
      - {id: 5, pwm: 1500, duration_ms: 3000}
      - {id: 6, pwm: 1500, duration_ms: 3000}
