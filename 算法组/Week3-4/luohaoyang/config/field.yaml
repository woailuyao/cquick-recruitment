# ============================================================
# 场地标志坐标（C0，本人实测，仅 +Y 半场）  [rev3 2026-11-22]
# ------------------------------------------------------------
# 原点   : 中圈中心（地面）
# 轴向   : +X 向右，+Y 向上，yaw 从 +X 逆时针为正
# 单位   : m
#
# rev3 变更：
#   - 删除 -Y 半场全部 10 个标志（LCross7~12、TCross7~10）——
#     那些是早期按对称"补"出来的，从未实测，会让匹配失败。
#   - 保留 +Y 半场 14 个实测标志。
#
# ⚠ 重要副作用（这次是好事）：
#   去掉下半场后，地图不再 180° 对称，**单帧就能唯一求解**，
#   不再依赖"上一帧先验"消歧，ambiguous 会大幅减少。
#   代价：y < -1 m 的区域无法定位（测试点必须在 +Y 半场）。
#
# 场地：x ∈ [-3, 3] 宽 6.00 m；y ∈ [0, 3.9] 已测（全长按 7.80 m）
#       球门线 y=+3.9；球门区深 0.95（y=2.95）；禁区深 1.90（y=2.00）
#       中圈半径 0.75（XCross 在中线与中圈的交点）
# ============================================================

version: measured-upper-only-2026-11-22-r3
frame: field_map
unit: m
origin_note: "原点 = 中圈中心；只收录 +Y 半场实测标志"
min_inliers: 3

markers:
  # ---------------- +Y 端（实测） ----------------
  - {id: LCross1,  type: LCross, x: -3.000, y: 3.900}   # 场地角点
  - {id: LCross2,  type: LCross, x: 3.000, y: 3.900}    # 场地角点
  - {id: LCross3,  type: LCross, x: -1.350, y: 2.950}   # 球门区角
  - {id: LCross4,  type: LCross, x: 1.350, y: 2.950}    # 球门区角
  - {id: LCross5,  type: LCross, x: -2.000, y: 2.000}   # 禁区角
  - {id: LCross6,  type: LCross, x: 2.000, y: 2.000}    # 禁区角
  - {id: TCross1,  type: TCross, x: 3.000, y: 0.000}    # 中线 × 右边线
  - {id: TCross2,  type: TCross, x: -3.000, y: 0.000}   # 中线 × 左边线
  - {id: TCross3,  type: TCross, x: 1.350, y: 3.900}    # 球门区边线 × 球门线
  - {id: TCross4,  type: TCross, x: 2.000, y: 3.900}    # 禁区边线 × 球门线
  - {id: TCross5,  type: TCross, x: -1.350, y: 3.900}
  - {id: TCross6,  type: TCross, x: -2.000, y: 3.900}

  # ---------------- 中圈与中线交点 ----------------
  - {id: XCross1,  type: XCross, x: -0.750, y: 0.000}
  - {id: XCross2,  type: XCross, x: 0.750, y: 0.000}

# 说明：
#   -Y 半场标志已删除（未实测）。若以后量了下半场，按同样格式加回来，
#   并注意地图会重新变成 180° 对称，届时必须靠跟踪先验消歧。
#   PenalityPoint 是中圈中心点，不是点球点，不收录。