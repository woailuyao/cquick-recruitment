# 相机参数汇总
# 由 calibration/camera_intrinsics.yaml 与 calibration/camera_extrinsics.yaml 汇总而来，
# 程序实际读取的是那两个文件；本文件用于快速查阅与文档引用。

image:
  width: 1280
  height: 720
  fps: 30

intrinsics:
  fx: 1612.90
  fy: 1614.95
  cx: 669.63
  cy: 352.07
  distortion_model: plumb_bob
  k1: 0.1360
  k2: -0.9501
  p1: -0.0033
  p2: 0.0014
  k3: 0.0
  rms_reprojection_px: 0.608
  heldout_rms_px: 0.434
  calibration_pattern: 9x6 inner corners
  calibration_frames: 45
  source_video: qp.avi
  date: 2026-11-21

extrinsics:
  method: solvePnP (IPPE) on 6 measured ground points
  camera_height_m: 0.643
  pitch_deg: 9.42
  roll_deg: 3.13
  yaw_deg: 0.33
  reprojection_rms_px: 6.89
  n_points: 6
  base_frame: 'base_link: x forward, y left, z up, ground z=0'
  camera_frame: 'camera (OpenCV): x right, y down, z forward'
  date: 2026-11-22

mounting:
  height_above_ground_m: 0.643
  pitch_down_deg: 9.42
  roll_deg: 3.13
  notes: >
    相机固定在三脚架/移动测试架上，定焦、固定对焦。
    标定完成后不得移动，否则外参失效。
    画面底边对应地面距离约 1.6 m，远端可见至地平线。