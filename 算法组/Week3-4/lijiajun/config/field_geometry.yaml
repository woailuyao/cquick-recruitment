notes:
  - 尺寸来源（2026-11-21 现场）：球门侧长边 5.95 m，纵深 3.88 m，X 点间距 1.45 m
  - L 近组间距 2.94 m、距球门 0.90 m；L 远组间距 3.93 m、距球门 1.83 m
  - 球门线上的 T 与两组 L 同 y（T 的 y 于 2026-11-22 现场实测修正为 ±1.945 / ±1.475）
  - 角点 L 与远端 T 位于两条长边端点
  - 场地关于 Y=0 完全对称：镜像解在几何上等价，靠“场内 + 高度合理”挑选，必要时用多帧或单侧可见点消歧
  - XCross1/XCross2 的连线在 X=0 上，其中点即官方原点，两点对称于 Y=0（±0.725）