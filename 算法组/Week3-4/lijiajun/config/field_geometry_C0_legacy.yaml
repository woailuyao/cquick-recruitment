# 旧 C0 场地几何（2026-11-21 换场地前的版本，仅作回放旧素材用）
# 用法：python src/p3p.py 旧视频.avi --geometry config/field_geometry_C0_legacy.yaml
# 配套原始点位见 config/field_C0_legacy.yaml。新素材不要用这个文件。
status: LEGACY_C0_2026_11_21
published_by: 算法组组织方
applies_to: 旧 C0 测试场地
units: meter
handedness: 右手系，+Z 垂直地面向上
reference_file: field_C0_legacy.yaml

frame:
  origin: 两个 XCross 标志点连线的中点
  origin_in_field_yaml: [3.0350, -4.0100]
  origin_derivation: (XCross1.x + XCross2.x)/2 = (4.505 + 1.565)/2 = 3.035；两点 y 均为 -4.010
  x_positive: 由原点指向球门
  y_positive: 面向 +X 时的球门左侧
  yaw_positive: 逆时针
  yaw_zero_reference: 地图 +X 方向

transform_from_field_yaml:
  note: field_C0_legacy.yaml 内的坐标本身不做任何改动，本节给出由它到官方系的固定映射
  rotation: [[0.0, 1.0], [-1.0, 0.0]]
  rotation_deg: -90
  formula: "p_official = R · (p_yaml - origin_in_field_yaml)"
  inverse: "p_yaml = Rᵀ · p_official + origin_in_field_yaml"
  expanded:
    - "X = y_yaml + 4.010"
    - "Y = 3.035 - x_yaml"

field_extent_official:
  x_range: [0.000, 6.940]
  y_range: [-4.430, 4.520]
  goal_line_x: 6.940
  far_touchline_x: 0.000
  note: 原点位于远离球门那条长边的中点上，不在场地几何中心

features_official:
  TCross1: [6.940, -2.920]
  TCross2: [6.940, -1.910]
  TCross3: [6.940, 2.035]
  TCross4: [6.940, 3.035]
  TCross5: [0.000, -4.430]
  TCross6: [0.000, 4.520]
  LCross1: [6.940, -4.430]
  LCross2: [6.940, 4.520]
  LCross3: [6.030, -1.910]
  LCross4: [6.030, 2.035]
  LCross5: [4.010, -2.920]
  LCross6: [4.010, 3.035]
  XCross1: [0.000, -1.470]
  XCross2: [0.000, 1.470]
  PenalityPoint: [4.895, 0.070]

lines:
  constant_x:
    - {value: 0.000, along_y: [-4.430, 4.520], endpoints: [TCross5, XCross1, XCross2, TCross6]}
    - {value: 6.030, along_y: [-1.910, 2.035], endpoints: [LCross3, LCross4]}
    - {value: 6.940, along_y: [-4.430, 4.520], endpoints: [LCross1, TCross1, TCross2, TCross3, TCross4, LCross2]}
  constant_y:
    - {value: -4.430, along_x: [0.000, 6.940], endpoints: [TCross5, LCross1]}
    - {value: -2.920, along_x: [4.010, 6.940], endpoints: [LCross5, TCross1]}
    - {value: -1.910, along_x: [6.030, 6.940], endpoints: [LCross3, TCross2]}
    - {value: 2.035, along_x: [6.030, 6.940], endpoints: [LCross4, TCross3]}
    - {value: 4.520, along_x: [0.000, 6.940], endpoints: [TCross6, LCross2]}