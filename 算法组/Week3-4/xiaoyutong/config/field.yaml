# C0 场地特征坐标（米）
# 坐标系：原点 = 中圈圆心（= 整场中心），+X 指向球门，+Y 面向 +X 时左侧，地面 Z=0
# 来源：Booster robocup_demo 官方 field.yaml（半场模型）换算而来，换算公式见 field_geometry.yaml
# 注意：坐标必须和实际场地一致。拿到场地后用卷尺按 docs 里的 5 分钟流程核对一遍，不一致就改这里。

# ---- T 型交点：中线与触线相交(2 个)、罚球区/球门区与球门线相交(4 个) ----
TCross5: [0.000, -4.430]
TCross6: [0.000, 4.520]
TCross1: [6.940, -2.920]
TCross2: [6.940, -1.910]
TCross3: [6.940, 2.035]
TCross4: [6.940, 3.035]

# ---- L 型拐角：场地四角(2 个)、罚球区拐角(2 个)、球门区拐角(1 个) ----
LCross1: [6.940, -4.430]
LCross2: [6.940, 4.520]
LCross3: [6.030, -1.910]
LCross4: [6.030, 2.035]
LCross5: [4.010, -2.920]

# ---- X 型交点：中圈与中线相交的 2 个点（左右各一） ----
XCross1: [0.000, -1.470]
XCross2: [0.000, 1.470]

# ---- 罚球点（官方拼写 PenalityPoint，代码里做别名映射） ----
PenalityPoint: [4.895, 0.070]

# ---- 中圈圆心（= 地图原点，用圆拟合也能直接得到它） ----
CenterSpot: [0.000, 0.000]
