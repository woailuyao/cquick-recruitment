# 相机配置（与标定、推理使用的同一台摄像头）
camera:
  device_node: /dev/video0        # 待现场确认
  resolution: [1280, 720]          # 统一 1280×720
  fps: 30                          # 目标 30 fps，实际帧率以连续取帧计时统计为准
  fourcc: MJPG
  focus: fixed                     # 固定焦距、固定对焦，关闭自动对焦/变焦
  # 内参、畸变系数见 calibration/camera_intrinsics.yaml（标定后生成）
  # 安装外参（高度/俯仰/滚转）见 calibration/camera_extrinsics.yaml

# 场地地图文件：使用组织方公共目录统一版本，个人目录不复制、不改坐标。
# 提交前在 README 记录 field.yaml / field_geometry.yaml 的版本号与 SHA256。
field_map:
  field_yaml: ../../../config/field.yaml            # 公共版本（相对路径引用，待组长发布）
  field_geometry_yaml: ../../../config/field_geometry.yaml
