# 本队场地实测坐标（俯视图）—— 2026-11-22 实测
#
# 坐标系约定（与官方示意图一致）：
#   原点 O = 场地中心（中线与球场中线的交点）
#   +X     = 指向球门方向
#   +Y     = 面向 +X 时的左侧
#   Z = 0  = 地面，单位：米
#
# 实测值（卷尺，单位 cm 实录后换算）
#   球门线长度 W1 = 600 cm = 6.000 m
#   两球门线间距 L1 = 760 cm = 7.600 m
#   球门区：宽 300 cm（a=150 / a=450），深 95 cm
#   罚球区：宽 400 cm（a=100 / a=500），深 190 cm
#   测量基准：球门线与左边线的交点为 (a=0, b=0)，
#             a 沿球门线向右量，b 垂直球门线向场内量
#   换算：x = L/2 - b = 3.800 - b ；y = W/2 - a = 3.000 - a
#
# 与官方 field.yaml 的差异：L 7.60 vs 6.94（+9.5%），W 6.00 vs 8.95（-33%）。
# 因此本队使用本文件，不沿用官方 field.yaml。
#
# 说明：远端球门按近端对称镜像填写（x 取反）。若远端画法不同，需单独实测后修改。
#
# 注意：两端完全对称时，整张图关于原点 180° 点对称，位姿存在“转 180°”的等价解，
#       PoseSolver 会恒定报 ambiguous。实时解算请用 config/field_measured_near.yaml。

field_length_m: 7.600     # L：球门线 -> 球门线
field_width_m: 6.000      # W：边线 -> 边线（球门线长度）
goal_width_m: 0.000       # 球门内宽：未测，仅记录用，不参与解算

# ---- 近端球门（+X 侧）----
TCross1: [3.800, 1.500]    # 内框侧线 ∩ 球门线（左）
TCross2: [3.800, -1.500]   # 内框侧线 ∩ 球门线（右）
TCross3: [3.800, 2.000]    # 外框侧线 ∩ 球门线（左）
TCross4: [3.800, -2.000]   # 外框侧线 ∩ 球门线（右）

LCross1: [3.800, 3.000]    # 球门线左角点 (a=0,   b=0)
LCross2: [3.800, -3.000]   # 球门线右角点 (a=600, b=0)
LCross3: [2.850, 1.500]    # 球门区前角（左） (a=150, b=95)
LCross4: [2.850, -1.500]   # 球门区前角（右） (a=450, b=95)
LCross5: [1.900, 2.000]    # 罚球区前角（左） (a=100, b=190)
LCross6: [1.900, -2.000]   # 罚球区前角（右） (a=500, b=190)

# ---- 远端球门（-X 侧，按近端镜像）----
TCross5: [-3.800, 1.500]
TCross6: [-3.800, -1.500]
TCross7: [-3.800, 2.000]
TCross8: [-3.800, -2.000]

LCross7: [-3.800, 3.000]
LCross8: [-3.800, -3.000]
LCross9: [-2.850, 1.500]
LCross10: [-2.850, -1.500]
LCross11: [-1.900, 2.000]
LCross12: [-1.900, -2.000]

# ---- 中线与两条边线的交点（现场确认有中线，T 型）----
TCross9:  [0.000, 3.000]
TCross10: [0.000, -3.000]
