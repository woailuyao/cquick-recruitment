# 本队场地实测坐标（俯视图）—— 近端球门 + 中线，共 12 点
#
# 用途：live_locate 实战解算。只保留近端（+X 侧）球门与中线的标志点。
# 原因：完整场地（两端球门都填）在几何上是 180° 点对称的，
#       位姿解会同时存在“转 180°”的等价解，PoseSolver 会恒报 ambiguous。
#       只保留一端后，远端检测到的点会被当作外点丢弃，解算唯一。
#       如果走到另一端测试，把 X 坐标取反后另存一份即可。
#
# 实测值（卷尺，单位 cm 实录后换算成 m）
#   球门线长度 W1 = 600 cm = 6.000 m
#   两球门线间距 L1 = 760 cm = 7.600 m
#   球门区：宽 300 cm（a=150 / a=450），深 95 cm
#   罚球区：宽 400 cm（a=100 / a=500），深 190 cm
#   换算：x = 3.800 - b ；y = 3.000 - a（a 从左边线沿球门线向右量，b 向场内量）

field_length_m: 7.600
field_width_m: 6.000
goal_width_m: 0.000

# ---- 近端球门（+X 侧）----
TCross1: [3.800, 1.500]    # 球门区侧线 ∩ 球门线（左）
TCross2: [3.800, -1.500]   # 球门区侧线 ∩ 球门线（右）
TCross3: [3.800, 2.000]    # 罚球区侧线 ∩ 球门线（左）
TCross4: [3.800, -2.000]   # 罚球区侧线 ∩ 球门线（右）

LCross1: [3.800, 3.000]    # 球门线左角点
LCross2: [3.800, -3.000]   # 球门线右角点
LCross3: [2.850, 1.500]    # 球门区前角（左）
LCross4: [2.850, -1.500]   # 球门区前角（右）
LCross5: [1.900, 2.000]    # 罚球区前角（左）
LCross6: [1.900, -2.000]   # 罚球区前角（右）

# ---- 中线与两条边线的交点（现场确认有中线，T 型）----
TCross7: [0.000, 3.000]
TCross8: [0.000, -3.000]
