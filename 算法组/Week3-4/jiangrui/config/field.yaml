# field.yaml —— 单目场地自定位用地图
#
# 坐标系定义:
#   原点 = 球场中心
#   +X   = 指向球门方向
#   +Y   = 面朝 +X 时的左手方向（Z 向上，右手系）
#   Z    = 0 位于地面，单位：米
#
# 场地尺寸: 球门间距 6.940 m，球门线长 8.950 m
# 几何取自官方 field.yaml，仅做坐标变换（平移 + 旋转），相对位置未改动
#
# 类别索引（考核细则顺序）:
#   0: LCross   1: TCross   2: XCross   3: PenaltyPoint
#   点球点坐标同样来自官方文件（2.965, 0.885），经同一变换得到，未改动相对位置
#   key 拼写沿用官方写法 PenalityPoint

TCross1: [3.470, -2.965]
TCross2: [3.470, -1.955]
TCross3: [3.470, 1.990]
TCross4: [3.470, 2.990]
TCross5: [-3.470, -4.475]
TCross6: [-3.470, 4.475]
LCross1: [3.470, -4.475]
LCross2: [3.470, 4.475]
LCross3: [2.560, -1.955]
LCross4: [2.560, 1.990]
LCross5: [0.540, -2.965]
XCross1: [-3.470, -1.515]
XCross2: [-3.470, 1.425]
PenalityPoint: [1.425, 0.025]
