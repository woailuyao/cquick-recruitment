# 任务2：场地标志检测数据集配置（YOLO 检测格式）
# 注意：图片与标签本身不上传 GitHub（按考核细则），此处仅记录目录结构与类别定义。
#       实际数据位于实验室工程目录，可用原绝对路径运行训练。

# 仓库内相对路径（图片不入库，仅示意结构）
path: .
train: images/train
val: images/val
test: images/test

nc: 4
names:
  0: LCross
  1: TCross
  2: XCross
  3: Point

# ---- 训练时实际使用的绝对路径（本机） ----
# path: /root/soccer_ws/field_master
# 训练命令：
#   yolo detect train model=yolov8n.pt data=<本文件> epochs=100 imgsz=960 device=cpu
#
# 数据集统计见 dataset/dataset_summary.md