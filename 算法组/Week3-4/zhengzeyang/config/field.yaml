# 场地标志坐标（米）—— 2026-11-15 实测值（记录见 942dcf10...jpg）
# 坐标系：O = 球场中心 = 中心圆圆心；+X 沿场地长轴（指向球门一端），+Y 为面向 +X 时的左侧；
#         yaw 自 +X 逆时针为正（度）。
# 键名格式：<类型><编号>: [x, y]；程序按前缀自动分类（L/T/X/P），编号可任意。
# 注意：实测点位关于原点中心对称（场地两端各有一套禁区标记），
#       因此“绝对航向”无法单靠点位区分，必须靠当前可见子集打破对称，
#       匹配模块的歧义检测会把这类情况报成 ambiguous。
CenterCircleRadius: 0.75      # 中心圆半径(m)；X1/X2 = 中线与中心圆的两个交点 = (0, ±0.75)

# ---------------- X 型：中心圆与中线的两个交点 ----------------
XCross1: [  0.000,  0.750]
XCross2: [  0.000, -0.750]

# ---------------- T 型 ----------------
TCross1: [  0.000,  3.000]    # 中线与边线交点
TCross2: [  0.000, -3.000]
TCross3: [  3.960,  1.950] 
TCross4: [  3.960,  1.40] 
TCross5: [  3.960,  -1.40]   # +X 端：禁区侧线与端线交点
TCross6: [  3.960, -1.950]
TCross7: [ -3.960,  1.950]    # -X 端：禁区侧线与端线交点
TCross8: [ -3.960, -1.950]
TCross9: [ -3.960, -1.40]
TCross10: [ -3.960, 1.40]

# ---------------- L 型 ----------------
LCross1: [  2.050,  2.000]
LCross2: [  2.050, -2.000]
LCross3: [  3.000,  1.490]    # +X 端禁区前角
LCross4: [  3.000, -1.490]
LCross5: [ -2.050,  2.000]
LCross6: [ -2.050, -2.000]
LCross7: [ -3.000,  1.490]    # -X 端禁区前角
LCross8: [ -3.000, -1.490]

# 点球点 = 球场中心 = 中心圆圆心。
# 真实场地中心**没有**画出小圆点，这个点不是“看”出来的，
# 而是由 XCross1/XCross2（中心圆与中线的交点）的中点导出，
# 见 src/ocv_live.py: derive_center_from_x()。
PenaltyPoint: [  0.000,  0.000]
