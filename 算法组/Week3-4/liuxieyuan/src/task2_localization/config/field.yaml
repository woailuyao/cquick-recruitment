# CQuick 任务二 场地坐标系（单位：米，俯视图）
#   原点 O  = 场地中心（中圈中心点，即中线中点）
#   +X      = 指向唯一球门；球门线在 X = 3.800（整场 6.03 m 的一半）
#   +Y      = 面朝 +X 时的左侧，半宽 1.99（Y ∈ [-1.99, +1.99]）
#   +Z      = 垂直地面向上，地面 Z = 0
#
# 半场：X ∈ [0, 3.800]、Y ∈ [-1.99, 1.99]
#   整场 6.03 × 3.98 m，原点在中线中点 —— 所以你手绘图上的 (0,300)、(398,300)
#   换到本坐标就是 (3.0, ±1.99)：球门线、边线交点。
#
# 坐标来源（手绘图，单位 cm；X=纵深 0~300，Y=宽度 0~398，已换算成米并平移到中心原点）：
#   (0,75)    -> 中线上的 T 形标志      (0.000, 0.75)
#   (0,199)   -> 中线与边线交点         (0.000, 1.99)
#   (203,198) -> 大禁区前沿角点         (2.030, 1.98)
#   (300,150) -> 球门区与端线交点       (3.800, 1.50)
#   (300,199) -> 场地死角               (3.800, 1.99)
# 建议卷尺复核：中线到球门线 3.800 m、边线到边线 3.98 m。

markers:
  # 原点：场地中心（中圈中心点）
  - type: 'CenterPoint'
    x: 0.000
    y: 0.160

  # 中线上的 T 形标志（中心点向左 0.75 m）
  - type: 'TCross'
    x: 0.000
    y: 0.910

  # 中线与边线交点（左侧）
  - type: 'TCross'
    x: 0.000
    y: 2.150

  # 大禁区前沿角点（左侧）
  - type: 'LCross'
    x: 1.900
    y: 2.140

  # 球门区与端线交点（左侧）
  - type: 'LCross'
    x: 3.800
    y: 1.660

  # 场地死角（左侧）
  - type: 'LCross'
    x: 3.800
    y: 2.150

  # ===== 右侧对称点 =====
  - type: 'TCross'
    x: 0.000
    y: -0.590

  - type: 'TCross'
    x: 0.000
    y: -1.830

  - type: 'LCross'
    x: 1.900
    y: -1.820

  - type: 'LCross'
    x: 3.800
    y: -1.340

  - type: 'LCross'
    x: 3.800
    y: -1.830


  # 球门区前沿角点（左侧）
  - type: 'LCross'
    x: 3.000
    y: 1.660

  - type: 'LCross'
    x: 3.000
    y: -1.340



