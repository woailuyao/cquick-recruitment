# C0 场地标志坐标（本人实测版）
#
# 依据：2026-11-09 群消息——任务二 yaml 由本人参考官方 field.yaml 定义，坐标本人实测。
# 坐标系：见 field_geometry.yaml。原点 O = 场地中心，+X 指向唯一球门，+Y 左侧（面向 +X），
#         地面 Z = 0，单位米。yaw 逆时针为正，+X 方向 yaw = 0。
#
# 测量：2026-11-12 实验室现场，卷尺实测（logs/field_measurements_raw.md 为原始记录）
#       a = 到就近端线的距离，b = 到右边线（俯视右侧）的距离
#       x = ±(4.175 − a)，y = b − 3.0
#
# 场地尺寸（含白线）：长 8.35 m（X 向）× 宽 6.00 m（Y 向）
# 设备：DFCXN-iM-2012V1，1280x720 MJPG，内参见 config/camera_intrinsics.yaml
#
# ⚠️ 已知实测偏差（场地画线本身不准，非测量错误，勿"修正"）：
#   - 中线实际位于 x=+0.125（非 0），y=-0.04；中圈半径实测 ≈0.73 m
#   - 点球点按实地位于几何中心 (0,0)，与中圈圆心存在约 12 cm 建模残差
#   - 与官方图纸差异：实际场地**无禁区弧线**，故无弧端点（图纸 T5/T6 不存在）
#
# 类别统计：L×8 + T×4 + X×2 + 点球点×1 = 15 个
# 官方拼写 PenalityPoint（少个 t），保持一致；代码侧做别名映射到 PenaltyPoint。

# ---------------- L 形拐角（8 个）----------------
LCross1: [ 2.295, -1.940]   # 球门端禁区框 前-右角
LCross2: [ 2.245,  1.950]   # 球门端禁区框 前-左角
LCross3: [-2.325, -1.920]   # 远端禁区框 前-右角
LCross4: [-2.205,  1.890]   # 远端禁区框 前-左角
LCross5: [ 4.175, -3.000]   # 场地角：球门端-右
LCross6: [ 4.175,  3.000]   # 场地角：球门端-左
LCross7: [-4.175, -3.000]   # 场地角：远端-右
LCross8: [-4.175,  3.000]   # 场地角：远端-左

# ---------------- T 形交点（4 个）----------------
TCross1: [ 0.125, -3.000]   # 中线 ∩ 右边线
TCross2: [ 0.125,  2.920]   # 中线 ∩ 左边线
TCross3: [ 4.175, -2.000]   # 球门线 ∩ 禁区框侧线（右）
TCross4: [ 4.175,  1.950]   # 球门线 ∩ 禁区框侧线（左）

# ---------------- X 形交叉（2 个）----------------
XCross1: [ 0.125, -0.800]   # 中圈 ∩ 中线（右半）
XCross2: [ 0.125,  0.660]   # 中圈 ∩ 中线（左半）

# ---------------- 点球点（1 个）----------------
PenalityPoint: [ 0.000, 0.000]   # 与场地中心 O 重合
