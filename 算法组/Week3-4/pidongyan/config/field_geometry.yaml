# C0 场地几何与坐标系定义（本人定义版）
#
# 依据：2026-11-09 群管理员配图《场地坐标系示意图（俯视图）》
# 细则要求：所有坐标使用米；本文件说明场地尺寸、坐标轴、原点和地图版本
#
# ⚠️ 场地尺寸（长/宽/各标志坐标）必须在实拍场地用卷尺实测后填入，
#    配图注明"内部标线仅作示意"，不能照抄示意图或官方 RoboCup 尺寸。

map_version: "c0-self-measured-v1"   # 实测更新后递增
length_unit: "meter"
ground_plane: { z: 0.0, normal: "+Z" }  # 地面 Z=0，法向朝上

# ---- 坐标系（右手法则）----
coordinate_system:
  origin: "场地中心 O"
  x_axis: "+X 指向唯一球门"          # 场地只有一端有球门，勿搞反方向
  y_axis: "+Y 为面向 +X 时的左侧"
  z_axis: "+Z 垂直地面向上"
  yaw_convention: "绕 +Z 轴，从 +X 转向 +Y 为正（右手系，逆时针为正，单位待定 rad/deg 在输出处注明）"

# ---- 场地尺寸（2026-11-12 实测）----
field_size:
  length_x: 8.35   # 沿 +X 方向的场地总长（米，含白线）
  width_y: 6.0     # 沿 +Y 方向的场地总宽（米，含白线）
  goal_side: "+X"  # 唯一球门所在侧
  note: "实测含白线外沿；场地中心 O 位于 x=0（距两端边线各 4.175m）、y=0（距两侧边线各 3.0m）"

# ---- 实测记录 ----
measurement_log:
  - { date: "2026-11-12", tool: "卷尺", note: "场地 8.35m × 6.0m（含白线）。中心 O：距球门端边线 4.175m、距两侧边线 3.0m" }
