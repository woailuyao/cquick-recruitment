# ============================================================================
# 演示用场地特征图 —— 仅用于在拿到官方 field.yaml 之前验证算法链路
#
# ⚠️ 这不是 C0 真实场地，不得用于评分、不得提交为本人的地图。
#    组长发放官方 field.yaml / field_geometry.yaml 后请整体替换本文件。
#
# 坐标系：X 向右、Y 向上、单位米、原点在场地左下角（细则 C0 约定）
#
# 布局是照着真实球场逻辑标的一圈边线标志：
#   - 四个角 LCross
#   - 两条边线上各两个 TCross（3m / 6m 处）
#   - 中线处 XCross，外加一个偏心的 XCross（用来打破 180° 旋转对称）
#   - 两个点球点
# 这样当相机站在场地中间正对某条边线时，能同时看到 2 个同类 T 标志 + 1 个 X，
# 正好覆盖细则 2.12 要求测试的"多标志正常场景"和"同类标志歧义场景"。
# ============================================================================
version: "demo-2026.11"
features:
  # 四个角
  - {id: 0, type: LCross, x: 0.0, y: 0.0}
  - {id: 1, type: LCross, x: 9.0, y: 0.0}
  - {id: 2, type: LCross, x: 0.0, y: 6.0}
  - {id: 3, type: LCross, x: 9.0, y: 6.0}

  # 两条边线上的 T 标志
  - {id: 4, type: TCross, x: 3.0, y: 0.0}
  - {id: 5, type: TCross, x: 6.0, y: 0.0}
  - {id: 6, type: TCross, x: 3.0, y: 6.0}
  - {id: 7, type: TCross, x: 6.0, y: 6.0}

  # 中线 / 偏心交叉标记（偏心的那个用来打破 180° 对称）
  - {id: 8, type: XCross, x: 4.5, y: 3.0}
  - {id: 9, type: XCross, x: 4.5, y: 1.0}

  # 点球点（官方拼写 PenalityPoint 已被程序自动别名映射）
  - {id: 10, type: PenaltyPoint, x: 2.0, y: 3.0}
  - {id: 11, type: PenaltyPoint, x: 7.0, y: 3.0}
