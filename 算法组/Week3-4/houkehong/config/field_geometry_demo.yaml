# ============================================================================
# 场地几何与坐标定义（细则 2.2 要求组织方配套发布）
#
# ⚠️ demo: true 表示这是演示/自测用地形，不是 C0 真实场地。
#    收到官方版本后整体替换，并核对 origin / axes / 单位完全一致。
# ============================================================================
map_version: "demo-2026.11"
demo: true
field_name: "DEMO 9x6 field (not C0)"

unit: m

# 地图原点（米）。X 向右、Y 向上、Yaw 从 +X 逆时针为正。
origin:
  x: 0.0
  y: 0.0

axes:
  x: "right"
  y: "up"
  yaw_positive: "ccw"

length_m: 9.0      # 沿 X
width_m: 6.0       # 沿 Y

# 地面平面
ground_plane_z: 0.0

# 该地图的适用范围说明
notes: >
  演示地图。四个角只标了三个，用于打破场地 180° 旋转对称，
  以便在没有额外先验的情况下演示唯一解。
  真实 C0 场地请使用组长统一发放的 field.yaml 与 field_geometry.yaml。
