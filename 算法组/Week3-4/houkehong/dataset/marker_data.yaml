# 任务 2 场地标志检测数据集配置
# 图片与标注不上传 GitHub；本文件说明路径结构与类别定义，便于评审复现。

path: ../datasets/marker_v6
train: images/train
val: images/val
test: images/test

nc: 2
names:
  - LCross
  - TCross

# 只训练 2 类的依据：
#   C0 现场实测确认只有 L 型与 T 型交叉，没有 X 型交叉；
#   点球点按场地定义固定在中心 (0,0)，现场无可见标志物。
#   依据细则 2.3「现场没有的类别不得强行要求训练或评分」。
#
# 数据来源
#   采集人       : HouKehong（本人）
#   采集设备     : 本人考核用单目 RGB USB 摄像头 1280x720 @30fps
#   采集日期     : 2026-11-18 / 2026-11-19 / 2026-11-21
#   原始视频     : 18 段（15 段有效 + 3 段中圈圆弧硬负样本）
#   抽帧 / 标注  : 529 张 / 940 个框（LCross 408 / TCross 532），其中 120 张空标注
#
# 划分（按视频片段，非随机）
#   train  397 张 / 671 框 / 120 空标注   （含 6 个方位角）
#   val     62 张 / 126 框                （含未见过方位角 164214）
#   test    70 张 / 143 框                （含 2 个未见过方位角 164402 / 164427）
#
# 测试集指标（weights/marker_best.pt，v6）
#   LCross  P 0.886  R 0.879  mAP50 0.930
#   TCross  P 0.799  R 0.364  mAP50 0.316
#   all     P 0.842  R 0.621  mAP50 0.623
