# 任务 1 足球检测数据集配置
# 图片与标注不上传 GitHub；本文件说明路径结构与类别定义，便于评审复现。
# 完整路径示例：<数据集根目录>/images/{train,val,test} 与 labels/{train,val,test}

path: ../datasets/ball
train: images/train
val: images/val
test: images/test

nc: 1
names:
  - ball

