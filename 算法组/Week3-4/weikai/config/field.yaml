# =====================================================================
# field.yaml —— 场地特征地图（本人实测版）
# ---------------------------------------------------------------------
# 坐标系（组长统一规定，见图「场地坐标系示意图(俯视图)」）：
#   原点 O   : 场地中心
#   +X       : 指向唯一球门
#   +Y       : 面向 +X 时的左侧
#   +Z       : 垂直地面向上
#   地面     : Z = 0，长度单位：米
# 场地尺寸与每个标志坐标由本人用卷尺实测后填入，格式参考
# Booster 官方 field.yaml（键名与 [x, y] 列表格式保持一致）。
#
# 注意：
# 1. 官方文件的数值对应官方场地和官方原点，【不要照抄数值】，
#    只参考键名与格式；坐标必须来自你自己的场地实测。
# 2. 官方拼写就是 PenalityPoint（不是 PenaltyPoint），
#    代码里如使用其他拼写请做别名映射，但本文件保持官方拼写。
# 3. 编号（TCross1、TCross2……）顺序自定，但必须与你标注/匹配
#    代码中的使用方式自洽，一旦确定不要再改名。
# 4. 填完后在注释里记录测量日期、测量工具和坐标系建立方法。
# =====================================================================

# --- 场地基本尺寸（实测后填写，米）---
field_length: 7.954    # 沿 +X 方向（球门侧端线 到 对面端线）的总长，实测 
field_width:  5.982    # 沿 +Y 方向（左侧边线 到 右侧边线）的总宽，实测 
goal_width:   2.886    # 球门宽度（信息记录用，本任务不检测球门），实测 

# --- 特征点坐标（全部实测，[x, y] 单位米）---
# 测量方法见 templates/field_测量工作表.md
TCross1: [ 3.977,  1.979]
TCross2: [ 3.977,  1.461]
TCross3: [ 3.977, -1.983]
TCross4: [ 3.977, -1.461]
TCross5: [ 0.000,  2.991]
TCross6: [ 0.000, -2.991]
LCross1: [ 2.052,  1.979]
LCross2: [ 3.084,  1.461]
LCross3: [ 2.077, -1.983]
LCross4: [ 3.084, -1.461]
LCross5: [ 3.977,  2.991]
LCross6: [ 3.977, -2.991]
PenalityPoint: [ 0.000,  0.000]  # 实测：点球点位于场地中心 O，即坐标系原点

# --- 测量记录 ---
# measured_by: weikai
# measured_date: 2026-11-19
# tools: 卷尺 5m、美纹纸临时标记
# origin_method: 取场地长宽中线的交点为 O，长边中线指向球门为 +X
# notes: 现场不存在的标志类别请整行删除或注释掉，不要保留 0,0 占位
