# 场地几何配置（C0 实际场地，2026-11-08 实测）
#
# 这个文件决定「原点在哪、X/Y 轴朝哪、1 个单位是多少米」。
# field.yaml 里的坐标只有在配合这套定义时才有意义。

field_id: C0
version: "2026-11-08 实测"
units: m

coordinate_frame:
  origin: "场地中心（中圈圆心）"
  x_positive: "指向球门"
  y_positive: "面向 +X 方向时的左侧"
  z_positive: "垂直地面向上"
  yaw_positive: "从 +X 轴逆时针为正"
  ground_plane: "Z = 0"

field_size_m:
  length_x: 8.40      # 球门方向 = 2.4 + 0.9 + 0.9
  width_y: 5.90

center_circle:
  radius: 0.75

# 大禁区：靠中心的那条边在 x = 2.4，球门线在 x = 4.2，深度 1.8
# 宽度 3.9 由「左边线到大禁区左边缘 1m」推出：5.9 - 2*1 = 3.9
penalty_area:
  far_line_x: 2.40
  depth: 1.80
  width: 3.90
  y_half: 1.95

# 小禁区：远边 x = 3.3（与大禁区远边相距 0.9），球门线 4.2，深度 0.9
# 宽度 2.9 由「大禁区左边缘到小禁区左边缘 0.5m」推出：3.9 - 2*0.5 = 2.9
goal_area:
  far_line_x: 3.30
  depth: 0.90
  width: 2.90
  y_half: 1.45

goal:
  width: 2.90         # 与小禁区同宽
  depth: 1.30         # 从球门线往里（场地外侧）的进深
  line_x: 4.20

# 相机安装（外参的一部分，直接以相机光心为载体参考原点）
camera_mount:
  height_m: 0.74      # 机器人固定高度
  mode: "刚性固定在机器人上，以相机光心作为载体参考原点"
  note: "高度一旦确定不得改变，否则内参/外参全部失效"

# 待核对项
todo:
  - "场地长 8.4 由三段间距推出，与初测 7.7 不一致；现场复测时用卷尺量一次全长"
  - "宽度 5.9 未经二次核对"
  - "所有坐标由尺寸推算，未逐点实测；若 PnP 残差异常，先怀疑这里"

source:
  measured_by: "chenjialiang"
  measured_on: "2026-11-08"
  method: "手机测距 + 脚步估算，部分间距由几何关系反推"
  note: "原点与轴向由组长确定"

# 本场地无 K1 标准场地上的 LCross / TCross / XCross 与点球点标记，
# 依据细则 2.3「现场没有的类别不得强行要求训练或评分」，
# 改用场地白线角点作为定位标志，共 8 类：
landmark_classes:
  - corner_front_left       # 球门端场地角 ( 4.20,  2.95)
  - corner_front_right      # 球门端场地角 ( 4.20, -2.95)
  - corner_back_left        # 后场端场地角 (-4.20,  2.95)
  - corner_back_right       # 后场端场地角 (-4.20, -2.95)
  - goalarea_far_left       # 小禁区远边左角 ( 3.30,  1.45)
  - goalarea_far_right      # 小禁区远边右角 ( 3.30, -1.45)
  - penalty_far_left        # 大禁区远边左角 ( 2.40,  1.95)
  - penalty_far_right       # 大禁区远边右角 ( 2.40, -1.95)

# 细则要求不检测球门，故不设 goal / goalpost 类别。
