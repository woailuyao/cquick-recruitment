# C0 实际场地标志点坐标（单位：米，全部位于地面 Z = 0）
#
# 坐标系（由组长确定）：
#   原点   : 场地中心（中圈圆心）
#   +X     : 指向球门
#   +Y     : 面向 +X 时的左侧
#   +Z     : 垂直地面向上
#   yaw    : 从 +X 轴逆时针为正
#
# 尺寸来源：
#   场地 8.4 (X) × 5.9 (Y)，中圈半径 0.75
#   中心到大禁区远边 2.4，大禁区到小禁区 0.9，小禁区到球门线 0.9
#   => 半场 2.4 + 0.9 + 0.9 = 4.2，全场 8.4
#   大禁区深 1.8，小禁区深 0.9
#   大禁区宽 3.9（y ±1.95），小禁区宽 2.9（y ±1.45），球门与小禁区同宽
#
#
# 官方 K1 场地文件另存为 field_official_k1.yaml。本场地没有 T/L/X 型标记，
# 那套 TCross/LCross 键名在这里没有对应物，不要混用。

# ---- 场地四角 ----
corner_front_left:  [ 4.200,  2.950]   # 球门端，左侧
corner_front_right: [ 4.200, -2.950]   # 球门端，右侧
corner_back_left:   [-4.200,  2.950]   # 后场端，左侧
corner_back_right:  [-4.200, -2.950]   # 后场端，右侧

# ---- 中圈与中线交点 ----
center_circle_left:  [ 0.000,  0.750]
center_circle_right: [ 0.000, -0.750]

# ---- 大禁区远边两角（靠场地中心的那条边）----
penalty_far_left:   [ 2.400,  1.950]
penalty_far_right:  [ 2.400, -1.950]

# ---- 小禁区远边两角 ----
goalarea_far_left:  [ 3.300,  1.450]
goalarea_far_right: [ 3.300, -1.450]

# ---- 球门柱（x 在球门线上，与小禁区同宽）----
goalpost_left:  [ 4.200,  1.450]
goalpost_right: [ 4.200, -1.450]
