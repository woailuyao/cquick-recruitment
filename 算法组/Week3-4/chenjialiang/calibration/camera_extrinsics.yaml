# 相机安装外参（相机光心相对载体参考原点）
#
# 载体定义：本工程把「相机光心」直接作为载体参考原点。
#   细则 2.1 允许这样做：「若相机安装在独立移动测试架上，也可以直接以相机光心
#   作为载体参考原点」。因此本文件中 camera->carrier 的平移为零，
#   输出的 x_camera_map 与 x_carrier_map 数值相同。
#
# 安装方式：固定支架（无轮），镜头朝前、向下俯 2.0 度，横滚 0 度。

reference_frame: camera_optical_center

camera_to_carrier:
  translation_m: [0.0, 0.0, 0.0]
  rotation_rpy_deg: [0.0, 0.0, 0.0]   # roll, pitch, yaw，全为 0（原点即光心）

mount:
  height_m: 1.00        # 镜头中心离地高度（卷尺实测）
  pitch_deg: 2.0        # 光轴相对水平面下俯角，用「已知站位反解」标定得到
  roll_deg: 0.0         # 假设无横滚

# 俯仰角的标定方法与灵敏度，写在这里便于复核：
#   方法：站到 (-1.00, 0.00)、高 1.00 m，拍一段，扫 0-40 度取重投影误差最小者，
#         得 2.0 度，该点位置误差中位数 5.9 cm。
#   灵敏度：Δd ≈ (d²/h)·Δpitch。俯角差 1.5 度，在 5.3 m 处造成 0.68 m 位置误差。
#   因此每次移动或重新安装支架后，必须重跑 src/geometry/fit_pitch.py。
