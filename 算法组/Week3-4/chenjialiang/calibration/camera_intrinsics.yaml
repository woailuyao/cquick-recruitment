# 相机内参标定结果（对应 calibration/calib_02_ok.mp4 那组棋盘格数据）
#
# 标定条件：
#   棋盘格 boards/chessboard_9x6_20mm.png，内角点 9x6，格子边长 20 mm（打印后卡尺复核）
#   图像分辨率 1280x720，与训练、推理完全一致
#   15 张以上、覆盖四角与不同倾角
#
# 注意：fx / fy / cx / cy 都是像素单位，分辨率一变全部失效。
#      本工程从采集、标定到推理全程锁死 1280x720。

image_width: 1280
image_height: 720

camera_matrix:
  fx: 1653.274
  fy: 1642.710
  cx: 646.380
  cy: 307.337

distortion:
  model: plumb_bob          # 径向 k1 k2 k3 + 切向 p1 p2
  k1:  0.282308
  k2: -2.161663
  p1: -0.004933
  p2:  0.003390
  k3:  3.708067

calibration:
  rms_reprojection_px: 0.53   # 验收参考线 0.5，本组略高，原因见 README「已知局限」
  num_views: 15
  board_pattern: [9, 6]
  square_size_m: 0.020

# 水平视场角 = 2*atan(640/fx)，用于判断两个标志能否同时入镜
horizontal_fov_deg: 42.3
