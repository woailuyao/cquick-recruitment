  - [ 0.000000, -0.317305, 0.948324 ]
  - [ -1.000000, 0.000000, 0.000000 ]
  - [ 0.000000, -0.948324, -0.317305 ]

# t：相机光心在载体坐标系中的位置（米）。只关心离地高度，水平偏移按需改。
t: [ 0.0000, 0.0000, 0.9300 ]



