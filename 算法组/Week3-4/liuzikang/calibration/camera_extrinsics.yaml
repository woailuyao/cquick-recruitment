# 相机外参（相机相对地面/载体的安装关系）
# 标定日期：2026-11-20
# 说明：标定、录屏、三个测试点测试期间，相机安装位置与角度保持不变。

height: 1.02          # 相机光心离地高度（米），卷尺量镜头中心到地面
pitch: 20.0           # 俯仰角（度），镜头向下倾斜为正
roll: 0.0             # 滚转角（度），相机水平安装

# 测定方法
method:
  height: "卷尺测量镜头中心到地面的垂直距离"
  pitch: "pitch = atan(h / D)，D 为画面中心落地点到相机正下方的水平距离"
  roll: "相机安装面水平，取 0"

# 使用注意
note: "外参一旦改变，所有米制坐标失效，必须重新测定"
