# 自己实测的场地坐标（单位：米）—— liuzikang 现场测量，2026-11-19
#
# 约定：
#   原点  = 点球点 = 场地中心
#   +X    = 朝球门（球门线在 X = +3.97）
#   +Y    = 面向球门时的左手边（边线在 Y = ±3.0）
#   +Z    = 垂直地面向上（地面 Z=0）
#   yaw   = 从 +X 轴逆时针为正（正对球门 = 0°）
#
# 实测数据：
#   场地宽度 6.00 m，球门那半场长 3.97 m
#   罚球区：宽 3.92 m（±1.96），从球门线往里 2.01 m（前沿 X=1.96）
#   小禁区：宽 2.96 m（±1.48），从球门线往里 1.02 m（前沿 X=2.95）

# 原点说明：
#   地上没有画"点球点"的圆点，但两个 X 的中点就是它（= 场地中心）。
#   也就是说原点虽然看不见，但可以用两个 X 重新确定，可复现。
#   PenalityPoint 保留在 (0,0) 作为名义原点，实际几乎检测不到，不影响匹配。
PenalityPoint: [0.00, 0.00]

# 中圈与中线相交的两个 X（相距 1.5 m，关于中心对称）
X1: [0.00, 0.75]
X2: [0.00, -0.75]

# 罚球区（大框）
L1: [1.96, 1.96]      # 左侧远角
L2: [1.96, -1.96]     # 右侧远角
T1: [3.97, 1.96]      # 罚球区线撞左底线
T2: [3.97, -1.96]     # 罚球区线撞右底线

# 小禁区（球门前的小框）
L3: [2.95, 1.48]      # 左侧远角
L4: [2.95, -1.48]     # 右侧远角
T3: [3.97, 1.48]      # 小禁区线撞左底线
T4: [3.97, -1.48]     # 小禁区线撞右底线

# 半场四角
#   中线那两角实际是 T 型（中线顶到边线，边线继续延伸到另一半场）
#   底线那两角是真正的场地角，L 型
T5: [0.00, 3.00]      # 左上：中线 × 上边线  → T
T6: [0.00, -3.00]     # 左下：中线 × 下边线  → T
L5: [3.97, 3.00]      # 右上：底线 × 上边线  → L（球场角）
L6: [3.97, -3.00]     # 右下：底线 × 下边线  → L（球场角）
