# ============================================================
# 场地标志点地图 —— 任务 2「地图匹配」
# 坐标系严格按《算法考核细则》场地坐标系示意图：
#   原点 O = 场地中心
#   +X     = 指向唯一球门
#   +Y     = 面向 +X 时的左侧
#   +Z     = 垂直地面向上（地面 Z = 0）
#   单位   = 米，右手系
# ============================================================
# 类别约定：
#   L = 线角（两线相交且都到此终止，如场地角、罚球区前角）
#   T = 丁字口（一条线终止在另一条延续线上，如中线与边线交点）
#   X = 十字交叉（两线交叉，本场地只有中圈与中线的交点）
#   P = 点球点（细则规定在场地中心，即原点 O）
# 共 16 个标志点

frame:
  origin: field_center
  x_axis: toward_goal
  y_axis: left_of_plus_x
  z_axis: up
  handedness: right
  unit: m

field:
  length_m: 8.0
  width_m: 6.0
  line_width_m: 0.05
  center_circle_r_m: 0.75
  penalty_depth_m: 1.0
  penalty_width_m: 3.8

# 唯一球门位于 +X 端；场地标线两端近似对称，
# 因此仅靠标线无法唯一确定 yaw，需靠球门消歧（0 或 180 deg）
goal:
  x: 4.0
  y: 0.0
  width_m: 2.8
  height_m: 2.0

markers:
  - {id: 1, type: L, x: 4.000, y: 3.000}      # 球门端/左边线 角
  - {id: 2, type: L, x: 4.000, y: -3.000}     # 球门端/右边线 角
  - {id: 3, type: L, x: -4.000, y: 3.000}     # 远端/左边线 角
  - {id: 4, type: L, x: -4.000, y: -3.000}    # 远端/右边线 角
  - {id: 5, type: L, x: 3.000, y: 1.900}      # 球门端罚球区 左前角
  - {id: 6, type: L, x: 3.000, y: -1.900}     # 球门端罚球区 右前角
  - {id: 7, type: L, x: -3.000, y: 1.900}     # 远端罚球区 左前角
  - {id: 8, type: L, x: -3.000, y: -1.900}    # 远端罚球区 右前角
  - {id: 9, type: T, x: 0.000, y: 3.000}      # 中线/左边线
  - {id: 10, type: T, x: 0.000, y: -3.000}    # 中线/右边线
  - {id: 11, type: T, x: 4.000, y: 1.900}     # 球门端罚球区边线/端线
  - {id: 12, type: T, x: 4.000, y: -1.900}    # 球门端罚球区边线/端线
  - {id: 13, type: T, x: -4.000, y: 1.900}    # 远端罚球区边线/端线
  - {id: 14, type: T, x: -4.000, y: -1.900}   # 远端罚球区边线/端线
  - {id: 15, type: X, x: 0.000, y: 0.750}     # 中圈/中线 交点上
  - {id: 16, type: X, x: 0.000, y: -0.750}    # 中圈/中线 交点下

# --- 已现场核对（2026-11-15 卷尺复核）---
# 1) length_m = 8.0：中线 → 端线 复测为 4.0 m，与 length/2 一致，本文件 x 值无需重算。
# 2) 点球点：细则规定在场地中心，但现场地面上什么都没有（用户回到场地确认），
#    故不作为可检测标志点，只作 anchors 参考。
# 3) goal.width_m = 2.8（球门内宽）、height_m = 2.0（横梁下沿到地面），均为卷尺实测。
