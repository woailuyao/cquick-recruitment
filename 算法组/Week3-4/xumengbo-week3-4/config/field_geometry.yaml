# ============================================================
# C0 场地几何配置（field_geometry.yaml）
# 依据：组长发布的《场地坐标系示意图（俯视图）》
# 作用：定义地图坐标系、轴向、单位与场地尺寸；算法启动时读取并校验
# 注意：本文件只描述几何基准，不参与标志匹配；坐标一律为米
# ============================================================

map_version: "C0-v1"        # 地图版本号，与 field.yaml 保持同一版本
unit: "m"                   # 长度单位：米
date: "2026-11-14"          # 实测日期，格式 YYYY-MM-DD（实测后填写）
measured_by: "xumengbo"     # 实测人

# ---------------- 坐标系定义（与组长示意图一致） ----------------
coordinate_system:
  origin:
    description: "场地中心（中线与中圈的交点）"
    x: 0.0
    y: 0.0
    z: 0.0
  axes:
    x_positive: "指向唯一球门方向（场地长轴）"
    y_positive: "面向 +X 时的左侧"
    z_positive: "垂直地面向上"
    handedness: "right"     # 右手系：X × Y = Z
  yaw:
    positive_direction: "从 +X 轴逆时针为正（俯视地图）"
    unit: "deg"             # 角度统一用度

ground_plane:
  z: 0.0                    # 地面定义为 Z = 0

# ---------------- 场地尺寸（本人实测，单位 m） ----------------
# 说明：下图仅为示意，内部标线不作为尺寸依据；以下数值必须用卷尺/激光测距实测后填写
# 布局：两端（+X 球门端 / −X 端）禁区与球门区对称；原点 O 为场地中心
field:
  length_x: 7.8             # 沿 +X 方向全长（两端线间距）；半场 3.9
  width_y: 6.0              # 沿 +Y 方向全宽（两边线间距）
  center_circle_radius: 0.72 # 中圈半径
  penalty_area:
    length_x: 1.9           # 罚球区沿 +X 方向深度（端线向内）
    width_y: 3.96           # 罚球区沿 +Y 方向宽度（半宽 1.98，边距 1.02）
  goal:
    center_x: 3.9           # 球门中心在 +X 轴上的坐标（=全长一半，距场地中心）
    center_y: 0.0          # 球门中心在 +Y 轴上的坐标（居中）
    width: 2.96            # 球门宽度（半宽 1.48）
  goal_area:                # 球门区（小禁区），两端对称
    length_x: 0.94          # 球门区从端线向内深度
    width_y: 2.96           # 球门区沿 +Y 方向宽度（半宽 1.48）
  field_actual_matches_map: true   # 实测尺寸与地图一致时保持 true；不一致必须改地图并重新实测

# ---------------- 一致性检查记录 ----------------
consistency_check:
  measured: true             # 是否完成实地测量核对（卷尺复核后置 true）
  note: "2026-11-14 卷尺复核：全长/全宽/禁区/球门区/中圈半径与下列尺寸一致，两端对称；两遍差 <5cm"
