# ============================================================
# 棋盘标定板参数（calib_board.yaml）
# 作用：相机内参标定脚本读取本文件的格边长、内角点数量和分辨率
# 注意：square_size 为现场卷尺实测值，不是图纸设计值
# ============================================================

board_type: "chessboard"          # 棋盘格（非 ChArUco）

# 内角点数量（脚本 findChessboardCorners 用）
pattern_cols: 7                   # 横向内角点 = 格子列数 8 - 1
pattern_rows: 5                   # 纵向内角点 = 格子行数 6 - 1

# 格子实际尺寸（现场卷尺实测）
square_size_mm: 28.0              # 单个格子实测边长，单位 mm
square_size_m: 0.028              # 同上，换算成米（标定世界坐标用）
measured_date: "2026-11-14"

# 标定与推理必须使用同一分辨率
image_width: 1280
image_height: 720

# 标定图像目录与需剔除的失败图
image_dir: "D:/W34_dataset/calib"
reject_images:
  - "calib_07.jpg"                # 太远/平铺，角点 0 个，不参与求解

# 备注：图纸设计格边长 25 mm，打印后实测为 28 mm，以实测为准
note: "棋盘 8 列 x 6 行；实测格边长 28mm；有效图 15 张，覆盖中心/四角/倾斜/远近"
