# ============================================================
# C0 场地标志点坐标（field.yaml · 定稿占位）
# 格式与官方参考文件一致：<类别名><序号>: [x, y]
#
# 坐标系（与组长《场地坐标系示意图》一致）：
#   原点 O = 场地中心（中线与中圈交点）
#   +X    = 指向唯一球门方向（长轴）
#   +Y    = 面向 +X 时的左侧
#   地面 Z = 0，坐标单位：米
#
# 现场清点结果（2026-11-10 实地确认）：
#   T 型交点 10 个、L 型交点 12 个、X 型交点 2 个，合计 24 个
#   点球点按细则规定位于场地中心（中圈与中线交点 O），与坐标原点重合，坐标 [0.0, 0.0]
#   现场无白色圆点标记；该点由中圈圆弧与中线交点几何推定，不依赖识别圆点
#
# 【坐标来源说明】
#   1. 官方参考 https://raw.githubusercontent.com/BoosterRobotics/robocup_demo/main/src/vision/config/field.yaml
#      是 BoosterRobotics 演示场地（13 个点、不同原点与尺寸），与本次 C0 场地不是同一块，不可直接套用。
#   2. 本地按实测几何推算的 24 点坐标见 field_theory.yaml（供定位链路联调）；
#      正式定稿以组长发布的 C0 版地图为准。拿到组长地图后再把下列占位逐个替换。
#   3. 除点球点（中心，真实值 [0.0, 0.0]）外，其余点当前为 0.0 占位；
#      坐标仍是 0.0 时定位结果全部无效。每行末尾 "位置：" 记录编号对应的物理位置。
# ============================================================

map_version: "C0-v1"        # 必须与 field_geometry.yaml 的 map_version 一致

# ---- L 型交点（取 L 形两条线的交会顶点）---- 共 12 个
LCross1:  [ 0.0, 0.0 ]      # 位置：
LCross2:  [ 0.0, 0.0 ]      # 位置：
LCross3:  [ 0.0, 0.0 ]      # 位置：
LCross4:  [ 0.0, 0.0 ]      # 位置：
LCross5:  [ 0.0, 0.0 ]      # 位置：
LCross6:  [ 0.0, 0.0 ]      # 位置：
LCross7:  [ 0.0, 0.0 ]      # 位置：
LCross8:  [ 0.0, 0.0 ]      # 位置：
LCross9:  [ 0.0, 0.0 ]      # 位置：
LCross10: [ 0.0, 0.0 ]      # 位置：
LCross11: [ 0.0, 0.0 ]      # 位置：
LCross12: [ 0.0, 0.0 ]      # 位置：

# ---- T 型交点（取 T 形横线与竖线的交点）---- 共 10 个
TCross1:  [ 0.0, 0.0 ]      # 位置：
TCross2:  [ 0.0, 0.0 ]      # 位置：
TCross3:  [ 0.0, 0.0 ]      # 位置：
TCross4:  [ 0.0, 0.0 ]      # 位置：
TCross5:  [ 0.0, 0.0 ]      # 位置：
TCross6:  [ 0.0, 0.0 ]      # 位置：
TCross7:  [ 0.0, 0.0 ]      # 位置：
TCross8:  [ 0.0, 0.0 ]      # 位置：
TCross9:  [ 0.0, 0.0 ]      # 位置：
TCross10: [ 0.0, 0.0 ]      # 位置：

# ---- X 型交点（取两条线的交会中心）---- 共 2 个
XCross1:  [ 0.0, 0.0 ]      # 位置：
XCross2:  [ 0.0, 0.0 ]      # 位置：

# ---- 点球点（细则规定位于场地中心，即中圈与中线交点 O，与原点重合）----
# 官方键名 PenalityPoint（官方拼写）；模型类别名统一为 PenaltyPoint，解析时做别名映射
PenalityPoint: [ 0.0, 0.0 ]  # 位置：场地中心（原点 O，中圈与中线交点）
