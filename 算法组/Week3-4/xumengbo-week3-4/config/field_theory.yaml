# ============================================================
# C0 场地标志点坐标（field_theory.yaml）
# 坐标系：原点 O = 场地中心；+X 指向球门；+Y 面向 +X 左侧；地面 Z=0；单位米
# 场地尺寸：全长 7.8（半长 3.9），全宽 6.0（半宽 3.0），中圈半径 0.72
# 禁区深 1.9 / 宽 3.96（半宽 1.98）；球门区深 0.94 / 宽 2.96（半宽 1.48）；两端对称
# 分型：L = 外框角 / 框内沿角；T = 端线框角 / 中线搭边线；X = 中圈弧与中线交点
# ============================================================

map_version: "C0-v1"

# ---- L 型交点（12 个）----
LCross1:  [ 3.90,  3.00 ]   # 外框 +X+Y 角
LCross2:  [ 3.90, -3.00 ]   # 外框 +X−Y 角
LCross3:  [-3.90,  3.00 ]   # 外框 −X+Y 角
LCross4:  [-3.90, -3.00 ]   # 外框 −X−Y 角
LCross5:  [ 2.00,  1.98 ]   # 禁区内沿 +X+Y
LCross6:  [ 2.00, -1.98 ]   # 禁区内沿 +X−Y
LCross7:  [-2.00,  1.98 ]   # 禁区内沿 −X+Y
LCross8:  [-2.00, -1.98 ]   # 禁区内沿 −X−Y
LCross9:  [ 2.96,  1.48 ]   # 球门区内沿 +X+Y
LCross10: [ 2.96, -1.48 ]   # 球门区内沿 +X−Y
LCross11: [-2.96,  1.48 ]   # 球门区内沿 −X+Y
LCross12: [-2.96, -1.48 ]   # 球门区内沿 −X−Y

# ---- T 型交点（10 个）----
TCross1:  [ 3.90,  1.98 ]   # 禁区端线 +X+Y
TCross2:  [ 3.90, -1.98 ]   # 禁区端线 +X−Y
TCross3:  [-3.90,  1.98 ]   # 禁区端线 −X+Y
TCross4:  [-3.90, -1.98 ]   # 禁区端线 −X−Y
TCross5:  [ 3.90,  1.48 ]   # 球门区端线 +X+Y
TCross6:  [ 3.90, -1.48 ]   # 球门区端线 +X−Y
TCross7:  [-3.90,  1.48 ]   # 球门区端线 −X+Y
TCross8:  [-3.90, -1.48 ]   # 球门区端线 −X−Y
TCross9:  [ 0.00,  3.00 ]   # 中线与 +Y 边线交点
TCross10: [ 0.00, -3.00 ]   # 中线与 −Y 边线交点

# ---- X 型交点（2 个）----
XCross1:  [ 0.00,  0.72 ]   # 中圈弧与中线 +Y 交点
XCross2:  [ 0.00, -0.72 ]   # 中圈弧与中线 −Y 交点

# ---- 点球点（细则规定位于场地中心 O，与原点重合）----
PenalityPoint: [ 0.00, 0.00 ]
