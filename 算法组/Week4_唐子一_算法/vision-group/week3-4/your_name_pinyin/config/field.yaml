# =====================================================================
# field.yaml —— 场地标志点坐标（本人实测）
#
# 所有坐标单位为【米】，相对于地图坐标系，地面平面 Z = 0。
#
# 坐标系约定：
#   原点 O = 场地正中心（中圈圆心）
#   +X 轴沿短边（5.93 m）指向唯一球门（上端）
#   +Y 轴面向 +X 时的左侧，沿长边（8.28 m）
#
# 标志点类别（与 YOLO 数据集类别名严格一致）：
#   LCross  —— 两条白线构成的直角拐角（L 形）
#   TCross  —— 一条线垂直撞到另一条线（T 形）
#
# 场地尺寸：
#   半场 X = 2.965 m，半场 Y = 4.14 m
#   大禁区：纵深 1.92 m，宽 3.92 m（半宽 1.96 m）
#   小禁区：纵深 0.93 m，宽 2.92 m（半宽 1.46 m）
#   上下两端均有大小禁区（对称）
# =====================================================================
version: "C0-v1.1"
unit: meter
aliases:
  PenalityPoint: PenaltyPoint
markers:
  # ---- 场地四角（LCross）----
  - type: LCross
    x: 2.965
    y: 4.14
  - type: LCross
    x: 2.965
    y: -4.14
  - type: LCross
    x: -2.965
    y: 4.14
  - type: LCross
    x: -2.965
    y: -4.14

  # ---- 中线与两条长边的交点（TCross）----
  - type: TCross
    x: 0.0
    y: 4.14
  - type: TCross
    x: 0.0
    y: -4.14

  # ---- +X 端（球门端）大禁区底角（LCross）----
  - type: LCross
    x: 1.045
    y: 1.96
  - type: LCross
    x: 1.045
    y: -1.96
  # ---- +X 端（球门端）小禁区底角（LCross）----
  - type: LCross
    x: 2.035
    y: 1.46
  - type: LCross
    x: 2.035
    y: -1.46

  # ---- -X 端大禁区底角（LCross）----
  - type: LCross
    x: -1.045
    y: 1.96
  - type: LCross
    x: -1.045
    y: -1.96
  # ---- -X 端小禁区底角（LCross）----
  - type: LCross
    x: -2.035
    y: 1.46
  - type: LCross
    x: -2.035
    y: -1.46

  # ---- +X 端（球门端）端线与大小禁区的交点（TCross）----
  - type: TCross
    x: 2.965
    y: 1.96
  - type: TCross
    x: 2.965
    y: -1.96
  - type: TCross
    x: 2.965
    y: 1.46
  - type: TCross
    x: 2.965
    y: -1.46

  # ---- -X 端端线与大小禁区的交点（TCross）----
  - type: TCross
    x: -2.965
    y: 1.96
  - type: TCross
    x: -2.965
    y: -1.96
  - type: TCross
    x: -2.965
    y: 1.46
  - type: TCross
    x: -2.965
    y: -1.46
