# =====================================================================
# field_geometry.yaml —— 场地尺寸、地图原点、坐标轴、单位、地图版本
#
# 本文件定义 field.yaml 中标志点坐标的几何约定。
# 所有成员必须遵循同一约定。
# =====================================================================

version: "C0-v1.0"
unit: meter

# 地图坐标系约定（本人实测）：
#   原点 O = 场地正中心（中圈圆心）
#   +X 轴沿场地【短边】方向，指向唯一球门
#   +Y 轴面向 +X 时的左侧，沿场地【长边】方向
#   +Z 垂直地面向上（右手系）
#   Yaw 从地图 +X 轴逆时针为正（单位：度）
#   地面平面为地图坐标系 Z = 0
axis:
  x_positive: toward_goal
  y_positive: left_of_plus_x
  yaw_positive: counter_clockwise
  yaw_unit: degree

# 场地外接尺寸（米），用于定位合法性判断与可视化边界
# X 方向 = 短边 5.93 m（指向球门）
# Y 方向 = 长边 8.28 m
field:
  length_x: 5.93     # X 方向跨度（短边，指向球门）
  length_y: 8.28     # Y 方向跨度（长边）
  origin: [0.0, 0.0] # 原点 = 场地正中心

# 实际场地几何是否与 field.yaml 一致（本人实测确认）
matches_field_yaml: true
